<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="description" content="学习大闯关 - 收集奥特曼和三国人物！">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>学习大闯关</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6C5CE7;
            --secondary: #00CEC9;
            --accent: #FDCB6E;
            --bg-dark: #1A1A2E;
            --bg-light: #16213E;
            --text: #FFFFFF;
            --error: #FF6B6B;
            --success: #26DE81;
            --common: #BDBDBD;
            --uncommon: #26DE81;
            --rare: #4D9FFF;
            --epic: #A855F7;
            --legendary: #F97316;
        }
        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; min-height: 100vh; }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: flex; flex-direction: column; align-items: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Header */
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 15px; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        .player-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .player-stats { font-size: 0.85rem; }
        .player-level { background: var(--accent); color: #333; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; }
        .gold-display { display: flex; align-items: center; gap: 5px; color: var(--accent); font-weight: bold; }

        /* Buttons */
        .btn { padding: 12px 30px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 5px 20px rgba(108,92,231,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 2px solid rgba(255,255,255,0.2); }
        .btn:hover { transform: translateY(-2px) scale(1.03); }
        .btn:active { transform: scale(0.98); }

        /* Home Page */
        .home-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 2.5rem; text-align: center; margin: 20px 0; background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .home-icon { font-size: 4rem; animation: bounce 2s ease-in-out infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .character-showcase { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; justify-content: center; }
        .char-card { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 10px 15px; text-align: center; min-width: 70px; }
        .char-icon { font-size: 2rem; }
        .char-name { font-size: 0.7rem; margin-top: 5px; color: rgba(255,255,255,0.7); }
        .char-count { font-size: 0.8rem; color: var(--accent); margin-top: 5px; }

        /* Level Select */
        .section-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.5rem; color: var(--accent); margin: 20px 0 15px; text-align: center; }
        .difficulty-selector { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .diff-btn { padding: 8px 20px; border-radius: 20px; border: 2px solid transparent; cursor: pointer; font-size: 0.9rem; transition: all 0.3s; }
        .diff-btn.active { border-color: var(--accent); background: rgba(253,203,110,0.2); }
        .diff-btn.easy { color: var(--uncommon); }
        .diff-btn.medium { color: var(--rare); }
        .diff-btn.hard { color: var(--legendary); }
        .mode-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .mode-btn { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px 10px; text-align: center; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; }
        .mode-btn:hover { transform: translateY(-3px); }
        .mode-btn.selected { border-color: var(--secondary); background: rgba(0,206,201,0.15); }
        .mode-icon { font-size: 1.8rem; }
        .mode-name { font-size: 0.85rem; margin-top: 5px; }
        .mode-desc { font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 3px; }

        /* Subject Grid */
        .subject-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
        .subject-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px 10px; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
        .subject-card:hover:not(.locked) { transform: translateY(-3px); background: rgba(255,255,255,0.1); }
        .subject-card.locked { opacity: 0.4; cursor: not-allowed; }
        .subject-card.locked::after { content: '🔒'; position: absolute; top: 5px; right: 5px; font-size: 1rem; }
        .subject-card.completed { border: 2px solid var(--success); }
        .subject-card.completed::before { content: '✅'; position: absolute; top: 5px; right: 5px; font-size: 0.9rem; }
        .subject-emoji { font-size: 2rem; }
        .subject-name { font-size: 0.9rem; margin-top: 5px; }
        .subject-count { font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 3px; }

        /* Quiz Page */
        .quiz-header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 15px; }
        .lives { display: flex; gap: 5px; }
        .life { font-size: 1.3rem; transition: all 0.3s; }
        .life.lost { opacity: 0.3; transform: scale(0.8); }
        .timer { font-size: 1.3rem; font-weight: bold; color: var(--accent); }
        .timer.warning { color: var(--error); animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .score-display { font-size: 0.9rem; color: var(--accent); }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.5s ease; }
        .question-card { width: 100%; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 25px; margin-bottom: 20px; text-align: center; }
        .question-number { font-size: 0.8rem; color: var(--secondary); margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; line-height: 1.6; }
        .mode-badge { display: inline-block; padding: 3px 10px; background: var(--primary); border-radius: 10px; font-size: 0.7rem; margin-bottom: 10px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        .option-btn { padding: 15px; font-size: 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; cursor: pointer; transition: all 0.3s; font-family: inherit; text-align: left; display: flex; align-items: center; gap: 10px; }
        .option-btn:hover:not(.disabled) { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .option-btn.disabled { cursor: not-allowed; }
        .option-btn.correct { background: var(--success); border-color: var(--success); animation: pop 0.4s ease; }
        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .option-btn.wrong { background: var(--error); border-color: var(--error); animation: shake 0.4s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
        .option-label { width: 28px; height: 28px; line-height: 28px; background: rgba(255,255,255,0.15); border-radius: 50%; text-align: center; font-weight: bold; }

        /* Result Page */
        .result-card { background: rgba(255,255,255,0.05); border-radius: 25px; padding: 30px; text-align: center; width: 100%; max-width: 400px; }
        .result-emoji { font-size: 4rem; margin-bottom: 15px; }
        .result-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.8rem; margin-bottom: 15px; }
        .result-title.success { color: var(--success); }
        .result-title.fail { color: var(--error); }
        .result-rewards { display: flex; gap: 15px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
        .reward-item { background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 12px; text-align: center; }
        .reward-icon { font-size: 1.5rem; }
        .reward-value { font-size: 0.9rem; color: var(--accent); font-weight: bold; }
        .reward-label { font-size: 0.7rem; color: rgba(255,255,255,0.6); }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }

        /* Gallery Page */
        .tab-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { padding: 8px 20px; border-radius: 20px; background: rgba(255,255,255,0.1); border: none; color: white; cursor: pointer; font-family: inherit; }
        .tab-btn.active { background: var(--primary); }
        .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; }
        .char-card-full { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px 10px; text-align: center; position: relative; }
        .char-card-full.locked { opacity: 0.5; }
        .char-card-full.owned { border: 2px solid var(--accent); }
        .char-card-full .char-icon { font-size: 2.5rem; }
        .char-card-full .char-name { font-size: 0.75rem; margin-top: 5px; }
        .char-card-full .char-rarity { font-size: 0.7rem; margin-top: 3px; }
        .fragments-count { font-size: 0.7rem; color: var(--secondary); margin-top: 3px; }

        /* Shop Page */
        .shop-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .shop-tab { padding: 8px 15px; border-radius: 15px; background: rgba(255,255,255,0.1); border: none; color: white; cursor: pointer; font-family: inherit; }
        .shop-tab.active { background: var(--primary); }
        .shop-item { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        .shop-item-icon { font-size: 2rem; width: 50px; text-align: center; }
        .shop-item-info { flex: 1; }
        .shop-item-name { font-size: 1rem; font-weight: bold; }
        .shop-item-desc { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
        .shop-item-price { display: flex; align-items: center; gap: 5px; color: var(--accent); font-weight: bold; }
        .shop-item-btn { padding: 8px 20px; border-radius: 15px; border: none; background: var(--primary); color: white; cursor: pointer; font-family: inherit; }
        .shop-item-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Tasks Page */
        .task-card { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        .task-icon { font-size: 2rem; width: 45px; text-align: center; }
        .task-info { flex: 1; }
        .task-name { font-size: 0.95rem; font-weight: bold; }
        .task-desc { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
        .task-progress { font-size: 0.8rem; color: var(--secondary); margin-top: 3px; }
        .task-reward { display: flex; align-items: center; gap: 5px; }
        .task-btn { padding: 8px 15px; border-radius: 12px; border: none; background: var(--accent); color: #333; cursor: pointer; font-family: inherit; font-weight: bold; }
        .task-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Feedback */
        .feedback { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; border-radius: 15px; font-size: 1.5rem; font-weight: bold; z-index: 100; animation: pop 0.4s ease; }
        .feedback.correct { background: var(--success); }
        .feedback.wrong { background: var(--error); }
        .feedback.show { display: block; }
        .feedback.hide { display: none; }

        /* Celebration */
        .celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }
        .confetti { position: absolute; width: 12px; height: 12px; animation: fall 2s ease-out forwards; }
        @keyframes fall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }

        /* Particles */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; width: 6px; height: 6px; background: var(--primary); border-radius: 50%; opacity: 0.3; animation: float 15s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.3; } 90% { opacity: 0.3; } 100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; } }

        /* Back button */
        .back-btn { position: fixed; top: 15px; left: 15px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 1.2rem; cursor: pointer; z-index: 50; }

        /* Responsive */
        @media (max-width: 500px) {
            .home-title { font-size: 2rem; }
            .subject-grid { grid-template-columns: repeat(2, 1fr); }
            .mode-selector { grid-template-columns: repeat(2, 1fr); }
            .options-grid { grid-template-columns: 1fr; }
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
            .header { flex-wrap: wrap; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="celebration" id="celebration"></div>
    <div class="feedback" id="feedback"></div>
    <button class="back-btn" id="backBtn" style="display:none;" onclick="goBack()">←</button>

    <div class="container">
        <!-- Home Page -->
        <div class="page active" id="homePage">
            <div class="home-icon">🎓</div>
            <h1 class="home-title">学习大闯关</h1>
            <div class="header">
                <div class="player-info">
                    <div class="player-avatar">👤</div>
                    <div>
                        <div class="player-level">Lv.<span id="playerLevel">1</span></div>
                        <div class="player-stats">经验: <span id="playerExp">0</span></div>
                    </div>
                </div>
                <div class="gold-display">🪙 <span id="playerGold">100</span></div>
            </div>

            <div class="section-title">已收集角色</div>
            <div class="character-showcase" id="charShowcase"></div>

            <button class="btn btn-primary" onclick="showLevelSelect()" style="margin: 20px 0;">开始挑战</button>

            <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
                <button class="btn btn-secondary" onclick="showGallery()">📖 图鉴</button>
                <button class="btn btn-secondary" onclick="showShop()">🛒 商店</button>
                <button class="btn btn-secondary" onclick="showTasks()">📋 任务</button>
            </div>
        </div>

        <!-- Level Select Page -->
        <div class="page" id="levelPage">
            <div class="section-title">选择难度</div>
            <div class="difficulty-selector">
                <button class="diff-btn easy active" onclick="selectDifficulty('easy')">⭐ 简单</button>
                <button class="diff-btn medium" onclick="selectDifficulty('medium')">⭐⭐ 中等</button>
                <button class="diff-btn hard" onclick="selectDifficulty('hard')">⭐⭐⭐ 困难</button>
            </div>

            <div class="section-title">选择模式</div>
            <div class="mode-selector" id="modeSelector"></div>

            <div class="section-title">选择学科</div>
            <div class="subject-grid" id="subjectGrid"></div>
        </div>

        <!-- Quiz Page -->
        <div class="page" id="quizPage">
            <div class="quiz-header">
                <div class="lives" id="lives"></div>
                <div class="score-display">🪙 +<span id="currentScore">0</span></div>
                <div class="timer" id="timer">20</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="question-card">
                <div class="mode-badge" id="modeBadge">限时挑战</div>
                <div class="question-number" id="questionNumber">第 1 题</div>
                <div class="question-text" id="questionText">题目内容</div>
            </div>
            <div class="options-grid" id="optionsGrid"></div>
        </div>

        <!-- Result Page -->
        <div class="page" id="resultPage">
            <div class="result-card">
                <div class="result-emoji" id="resultEmoji">🏆</div>
                <div class="result-title" id="resultTitle">恭喜通关！</div>
                <div class="result-rewards" id="resultRewards"></div>
                <div class="stat-row"><span>得分</span><span id="finalScore">0</span></div>
                <div class="stat-row"><span>正确率</span><span id="finalAccuracy">0%</span></div>
                <div class="stat-row"><span>获得金币</span><span id="finalGold">+0</span></div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="showLevelSelect()">再闯一关</button>
                    <button class="btn btn-secondary" onclick="showHome()">返回首页</button>
                </div>
            </div>
        </div>

        <!-- Gallery Page -->
        <div class="page" id="galleryPage">
            <div class="section-title">📖 角色图鉴</div>
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchGalleryTab('ultra')">奥特曼</button>
                <button class="tab-btn" onclick="switchGalleryTab('threeKingdoms')">三国人物</button>
            </div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>

        <!-- Shop Page -->
        <div class="page" id="shopPage">
            <div class="section-title">🛒 商店</div>
            <div class="shop-tabs">
                <button class="shop-tab active" onclick="switchShopTab('chars')">角色</button>
                <button class="shop-tab" onclick="switchShopTab('items')">道具</button>
                <button class="shop-tab" onclick="switchShopTab('equip')">装备</button>
            </div>
            <div id="shopContent"></div>
        </div>

        <!-- Tasks Page -->
        <div class="page" id="tasksPage">
            <div class="section-title">📋 任务中心</div>
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTaskTab('daily')">每日</button>
                <button class="tab-btn" onclick="switchTaskTab('weekly')">每周</button>
            </div>
            <div id="tasksContent"></div>
        </div>
    </div>

<script>

    const saved = localStorage.getItem('learningGameV2');
    if (saved) {
        gameState = JSON.parse(saved);
    }
}

function saveGame() {
    localStorage.setItem('learningGameV2', JSON.stringify(gameState));
}

function updateHomeUI() {
    document.getElementById('playerLevel').textContent = gameState.player.level;
    document.getElementById('playerExp').textContent = gameState.player.exp;
    document.getElementById('playerGold').textContent = gameState.player.gold;
    renderCharShowcase();
}

function renderCharShowcase() {
    const container = document.getElementById('charShowcase');
    const chars = gameState.player.characters || [];
    const ultraCount = chars.filter(c => ULTRA_HEROES.find(u => u.id === c)).length;
    const tkCount = chars.filter(c => THREE_KINGDOMS.find(t => t.id === c)).length;

    container.innerHTML = `
        <div class="char-card">
            <div class="char-icon">🧙</div>
            <div class="char-name">奥特曼</div>
            <div class="char-count">${ultraCount}/16</div>
        </div>
        <div class="char-card">
            <div class="char-icon">⚔️</div>
            <div class="char-name">三国人物</div>
            <div class="char-count">${tkCount}/24</div>
        </div>
    `;
}

// ==================== NAVIGATION ====================
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    document.getElementById('backBtn').style.display = pageId === 'homePage' ? 'none' : 'block';
}

function showHome() { showPage('homePage'); }

function goBack() {
    const currentPage = document.querySelector('.page.active').id;
    if (currentPage === 'levelPage' || currentPage === 'galleryPage' || currentPage === 'shopPage' || currentPage === 'tasksPage') {
        showHome();
    } else if (currentPage === 'quizPage') {
        stopTimer();
        showLevelSelect();
    } else {
        showHome();
    }
}

function showLevelSelect() {
    renderModeSelector();
    renderSubjectGrid();
    showPage('levelPage');
}

// ==================== LEVEL SELECTION ====================
let selectedDifficulty = 'easy';
let selectedMode = null;

function selectDifficulty(diff) {
    selectedDifficulty = diff;
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.diff-btn.${diff}`).classList.add('active');
}

function renderModeSelector() {
    const container = document.getElementById('modeSelector');
    container.innerHTML = MODES.map(m => `
        <div class="mode-btn" onclick="selectMode('${m.id}')">
            <div class="mode-icon">${m.emoji}</div>
            <div class="mode-name">${m.name}</div>
            <div class="mode-desc">${m.desc}</div>
        </div>
    `).join('');
}

function selectMode(modeId) {
    selectedMode = modeId;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
}

function renderSubjectGrid() {
    const container = document.getElementById('subjectGrid');
    container.innerHTML = SUBJECTS.map((s, i) => `
        <div class="subject-card ${i >= 3 ? 'locked' : ''}" onclick="startQuiz('${s.id}')">
            <div class="subject-emoji">${s.emoji}</div>
            <div class="subject-name">${s.name}</div>
            <div class="subject-count">简单/中等/困难</div>
        </div>
    `).join('');
}

// ==================== QUIZ LOGIC ====================
function startQuiz(subjectId) {
    if (!selectedMode) {
        alert('请先选择闯关模式！');
        return;
    }

    const modeConfig = MODES.find(m => m.id === selectedMode);
    const bank = QUESTION_BANK[subjectId];
    const diffQuestions = bank[selectedDifficulty] || [];

    // Random select questions
    const shuffled = [...diffQuestions].sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, Math.min(modeConfig.questions, shuffled.length));

    currentQuiz = {
        subject: subjectId,
        difficulty: selectedDifficulty,
        mode: selectedMode,
        questions: selected,
        currentQ: 0,
        lives: modeConfig.lives,
        score: 0,
        timeLeft: modeConfig.time === 999 ? 999 : modeConfig.time,
        timerInterval: null,
        streak: 0,
        totalAnswered: 0
    };

    showPage('quizPage');
    renderQuiz();
}

function renderQuiz() {
    const q = currentQuiz.questions[currentQuiz.currentQ];
    const modeConfig = MODES.find(m => m.id === currentQuiz.mode);

    // Update header
    renderLives();
    document.getElementById('currentScore').textContent = currentQuiz.score;
    document.getElementById('timer').textContent = currentQuiz.timeLeft === 999 ? '∞' : currentQuiz.timeLeft;
    document.getElementById('timer').classList.remove('warning');

    // Update progress
    const progress = (currentQuiz.currentQ / currentQuiz.questions.length) * 100;
    document.getElementById('progressFill').style.width = `${progress}%`;
    document.getElementById('questionNumber').textContent = `第 ${currentQuiz.currentQ + 1} 题 / 共 ${currentQuiz.questions.length} 题`;
    document.getElementById('modeBadge').textContent = modeConfig.name;

    // Update question
    document.getElementById('questionText').textContent = q.q;

    // Update options
    const optionsGrid = document.getElementById('optionsGrid');
    const labels = ['A', 'B', 'C', 'D'];
    optionsGrid.innerHTML = q.o.map((opt, i) => `
        <button class="option-btn" onclick="selectAnswer(${i})">
            <span class="option-label">${labels[i]}</span>
            <span>${opt}</span>
        </button>
    `).join('');

    // Start timer
    if (currentQuiz.timeLeft !== 999) {
        startTimer();
    }
}

function renderLives() {
    const container = document.getElementById('lives');
    const maxLives = currentQuiz.lives;
    container.innerHTML = Array(maxLives).fill(0).map((_, i) =>
        `<span class="life ${i >= currentQuiz.lives ? 'lost' : ''}">❤️</span>`
    ).join('');
}

function startTimer() {
    clearInterval(currentQuiz.timerInterval);
    currentQuiz.timerInterval = setInterval(() => {
        if (currentQuiz.timeLeft > 0) {
            currentQuiz.timeLeft--;
            document.getElementById('timer').textContent = currentQuiz.timeLeft;
            if (currentQuiz.timeLeft <= 10) {
                document.getElementById('timer').classList.add('warning');
            }
            if (currentQuiz.timeLeft <= 0) {
                handleTimeout();
            }
        }
    }, 1000);
}

function stopTimer() {
    clearInterval(currentQuiz.timerInterval);
}

function handleTimeout() {
    stopTimer();
    showFeedback(false);
    currentQuiz.lives--;
    currentQuiz.streak = 0;
    renderLives();

    setTimeout(() => {
        if (currentQuiz.lives <= 0) {
            endQuiz(false);
        } else {
            nextQuestion();
        }
    }, 1500);
}

function selectAnswer(index) {
    stopTimer();
    currentQuiz.totalAnswered++;

    const q = currentQuiz.questions[currentQuiz.currentQ];
    const isCorrect = index === q.a;
    const buttons = document.querySelectorAll('.option-btn');

    buttons.forEach(b => b.classList.add('disabled'));
    buttons[index].classList.add(isCorrect ? 'correct' : 'wrong');
    if (!isCorrect) {
        buttons[q.a].classList.add('correct');
    }

    if (isCorrect) {
        showFeedback(true);
        createCelebration();
        currentQuiz.streak++;
        currentQuiz.score += 100;

        // Mode specific bonuses
        if (currentQuiz.mode === 'timed') {
            currentQuiz.timeLeft += 3;
        } else if (currentQuiz.mode === 'elite') {
            currentQuiz.score += 100;
        } else if (currentQuiz.mode === 'endurance' && currentQuiz.streak >= 3) {
            currentQuiz.lives = Math.min(currentQuiz.lives + 1, 5);
        }
    } else {
        showFeedback(false);
        currentQuiz.lives--;
        currentQuiz.streak = 0;
        renderLives();
    }

    setTimeout(() => {
        if (currentQuiz.lives <= 0) {
            endQuiz(false);
        } else if (currentQuiz.currentQ >= currentQuiz.questions.length - 1) {
            endQuiz(true);
        } else {
            nextQuestion();
        }
    }, 1500);
}

function nextQuestion() {
    currentQuiz.currentQ++;
    renderQuiz();
}

function endQuiz(success) {
    stopTimer();
    clearCelebration();

    // Calculate rewards
    const goldEarned = Math.floor(currentQuiz.score / 10);
    const fragmentEarned = success ? Math.floor(Math.random() * 3) + 1 : 0;

    gameState.player.gold += goldEarned;
    gameState.player.totalAnswered = (gameState.player.totalAnswered || 0) + currentQuiz.totalAnswered;

    // Random fragment
    if (fragmentEarned > 0 && Math.random() > 0.5) {
        const allChars = [...ULTRA_HEROES, ...THREE_KINGDOMS];
        const randomChar = allChars[Math.floor(Math.random() * allChars.length)];
        gameState.player.fragments[randomChar.id] = (gameState.player.fragments[randomChar.id] || 0) + fragmentEarned;
    }

    saveGame();

    // Show result
    document.getElementById('resultEmoji').textContent = success ? '🏆' : '💔';
    document.getElementById('resultTitle').textContent = success ? '恭喜通关！' : '挑战失败';
    document.getElementById('resultTitle').className = 'result-title ' + (success ? 'success' : 'fail');

    const accuracy = currentQuiz.totalAnswered > 0
        ? Math.round((currentQuiz.questions.filter((_, i) => i < currentQuiz.currentQ && true).length / currentQuiz.totalAnswered) * 100)
        : 0;

    document.getElementById('finalScore').textContent = currentQuiz.score;
    document.getElementById('finalAccuracy').textContent = `${Math.round((currentQuiz.currentQ + 1) / currentQuiz.questions.length * 100)}%`;
    document.getElementById('finalGold').textContent = `+${goldEarned}`;

    document.getElementById('resultRewards').innerHTML = `
        <div class="reward-item">
            <div class="reward-icon">🪙</div>
            <div class="reward-value">+${goldEarned}</div>
            <div class="reward-label">金币</div>
        </div>
        ${fragmentEarned > 0 ? `
        <div class="reward-item">
            <div class="reward-icon">✨</div>
            <div class="reward-value">+${fragmentEarned}</div>
            <div class="reward-label">碎片</div>
        </div>
        ` : ''}
    `;

    showPage('resultPage');

    if (success) {
        createMassiveCelebration();
    }
}

// ==================== GALLERY ====================
function showGallery() {
    renderGallery('ultra');
    showPage('galleryPage');
}

function switchGalleryTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.currentTarget.classList.add('active');
    renderGallery(tab);
}

function renderGallery(tab) {
    const container = document.getElementById('galleryGrid');
    const chars = tab === 'ultra' ? ULTRA_HEROES : THREE_KINGDOMS;
    const owned = gameState.player.characters || [];

    container.innerHTML = chars.map(c => {
        const isOwned = owned.includes(c.id);
        const fragments = gameState.player.fragments[c.id] || 0;
        return `
            <div class="char-card-full ${isOwned ? 'owned' : 'locked'}">
                <div class="char-icon">${c.emoji}</div>
                <div class="char-name">${c.name}</div>
                <div class="char-rarity">${c.rarity}</div>
                ${isOwned ? '<div style="color:var(--success)">已拥有</div>' : `<div class="fragments-count">碎片: ${fragments}/${c.fragments}</div>`}
            </div>
        `;
    }).join('');
}

// ==================== SHOP ====================
function showShop() {
    renderShop('chars');
    showPage('shopPage');
}

function switchShopTab(tab) {
    document.querySelectorAll('.shop-tab').forEach(b => b.classList.remove('active'));
    event.currentTarget.classList.add('active');
    renderShop(tab);
}

function renderShop(tab) {
    const container = document.getElementById('shopContent');

    if (tab === 'chars') {
        const allChars = [...ULTRA_HEROES, ...THREE_KINGDOMS];
        container.innerHTML = allChars.map(c => {
            const owned = gameState.player.characters.includes(c.id);
            return `
                <div class="shop-item">
                    <div class="shop-item-icon">${c.emoji}</div>
                    <div class="shop-item-info">
                        <div class="shop-item-name">${c.name} ${c.rarity}</div>
                        <div class="shop-item-desc">技能：${c.skill}</div>
                    </div>
                    <div class="shop-item-price">🪙 ${c.price}</div>
                    <button class="shop-item-btn" ${owned || gameState.player.gold < c.price ? 'disabled' : ''} onclick="buyChar('${c.id}')">
                        ${owned ? '已拥有' : '购买'}
                    </button>
                </div>
            `;
        }).join('');
    } else if (tab === 'items') {
        container.innerHTML = SHOP_ITEMS.map(item => `
            <div class="shop-item">
                <div class="shop-item-icon">${item.emoji}</div>
                <div class="shop-item-info">
                    <div class="shop-item-name">${item.name}</div>
                    <div class="shop-item-desc">${item.desc}</div>
                </div>
                <div class="shop-item-price">🪙 ${item.price}</div>
                <button class="shop-item-btn" ${gameState.player.gold < item.price ? 'disabled' : ''} onclick="buyItem('${item.id}')">购买</button>
            </div>
        `).join('');
    } else {
        container.innerHTML = EQUIPMENT.map(eq => `
            <div class="shop-item">
                <div class="shop-item-icon">${eq.emoji}</div>
                <div class="shop-item-info">
                    <div class="shop-item-name">${eq.name}</div>
                    <div class="shop-item-desc">装备槽位：${eq.slot}</div>
                </div>
                <div class="shop-item-price">🪙 ${eq.price}</div>
                <button class="shop-item-btn" ${gameState.player.gold < eq.price ? 'disabled' : ''} onclick="buyEquip('${eq.id}')">购买</button>
            </div>
        `).join('');
    }
}

function buyChar(id) {
    const allChars = [...ULTRA_HEROES, ...THREE_KINGDOMS];
    const char = allChars.find(c => c.id === id);
    if (!char || gameState.player.characters.includes(id)) return;

    if (gameState.player.gold >= char.price) {
        gameState.player.gold -= char.price;
        gameState.player.characters.push(id);
        saveGame();
        updateHomeUI();
        renderShop('chars');
        alert(`恭喜获得 ${char.name}！`);
    }
}

function buyItem(id) {
    const item = SHOP_ITEMS.find(i => i.id === id);
    if (!item || gameState.player.gold < item.price) return;

    gameState.player.gold -= item.price;
    gameState.player.items.push({ id: item.id, count: 1 });
    saveGame();
    updateHomeUI();
    renderShop('items');
}

function buyEquip(id) {
    const eq = EQUIPMENT.find(e => e.id === id);
    if (!eq || gameState.player.gold < eq.price) return;

    gameState.player.gold -= eq.price;
    gameState.player.equipment[eq.slot] = id;
    saveGame();
    updateHomeUI();
    renderShop('equip');
}

// ==================== TASKS ====================
function showTasks() {
    renderTasks('daily');
    showPage('tasksPage');
}

function switchTaskTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.currentTarget.classList.add('active');
    renderTasks(tab);
}

function renderTasks(tab) {
    const container = document.getElementById('tasksContent');
    const tasks = tab === 'daily' ? DAILY_TASKS : WEEKLY_TASKS;
    const progress = tab === 'daily' ? (gameState.dailyTasks || {}) : (gameState.weeklyTasks || {});

    container.innerHTML = tasks.map(t => {
        const p = progress[t.id] || 0;
        const completed = p >= t.target;
        return `
            <div class="task-card">
                <div class="task-icon">${completed ? '✅' : '📋'}</div>
                <div class="task-info">
                    <div class="task-name">${t.name}</div>
                    <div class="task-desc">${t.desc}</div>
                    <div class="task-progress">${p}/${t.target}</div>
                </div>
                <div class="task-reward">
                    <span>🪙 ${t.reward.value}</span>
                    <button class="task-btn" ${completed ? 'disabled' : ''}>领取</button>
                </div>
            </div>
        `;
    }).join('');
}

// ==================== EFFECTS ====================
function showFeedback(correct) {
    const feedback = document.getElementById('feedback');
    feedback.textContent = correct ? '正确！🎉' : '错误！😢';
    feedback.className = 'feedback ' + (correct ? 'correct' : 'wrong') + ' show';
    setTimeout(() => feedback.className = 'feedback hide', 1200);
}

function createCelebration() {
    const container = document.getElementById('celebration');
    const colors = ['#FF6B6B', '#26DE81', '#FDCB6E', '#6C5CE7', '#00CEC9'];
    for (let i = 0; i < 15; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        container.appendChild(confetti);
        setTimeout(() => confetti.remove(), 2500);
    }
}

function createMassiveCelebration() {
    const container = document.getElementById('celebration');
    const colors = ['#FF6B6B', '#26DE81', '#FDCB6E', '#6C5CE7', '#00CEC9'];
    for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.animationDelay = Math.random() * 2 + 's';
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        container.appendChild(confetti);
        setTimeout(() => confetti.remove(), 5000);
    }
}

function clearCelebration() {
    document.getElementById('celebration').innerHTML = '';
}

function createParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 15; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (10 + Math.random() * 10) + 's';
        container.appendChild(particle);
    }
}

// ==================== PWA ====================
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    });
}

// Initialize
init();
</script>
