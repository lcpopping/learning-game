<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C5CE7">
    <meta name="description" content="学习大闯关 - 收集奥特曼和三国人物！">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="学习大闯关">
    <title>学习大闯关</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%236C5CE7'/><text x='90' y='125' font-size='90' text-anchor='middle' fill='white'>🎓</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6C5CE7;
            --secondary: #00CEC9;
            --accent: #FDCB6E;
            --bg-dark: #1A1A2E;
            --bg-light: #16213E;
            --text: #FFFFFF;
            --error: #FF6B6B;
            --success: #26DE81;
        }
        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-light) 100%);
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; opacity: 0.3; animation: float 15s infinite; }
        @keyframes float { 0%,100% { transform: translateY(100vh); opacity: 0; } 10% { opacity: 0.3; } 90% { opacity: 0.3; } 100% { transform: translateY(-100vh); opacity: 0; } }
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: flex; flex-direction: column; align-items: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .header-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 15px; }
        .coins-display { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; font-weight: bold; color: var(--accent); }
        .coins-icon { font-size: 1.3rem; }
        .back-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-family: inherit; }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
        /* Home Page */
        .home-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 2.8rem; text-align: center; background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: titlePulse 3s ease-in-out infinite; margin-bottom: 10px; }
        @keyframes titlePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        .home-icon { font-size: 4rem; animation: bounce 2s ease-in-out infinite; margin: 20px 0; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .home-subtitle { font-size: 1rem; color: rgba(255,255,255,0.7); margin-bottom: 30px; }
        .btn { padding: 15px 40px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; font-family: inherit; position: relative; overflow: hidden; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: var(--text); box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: var(--text); border: 2px solid rgba(255,255,255,0.2); }
        .btn:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 35px rgba(108, 92, 231, 0.5); }
        .btn:active { transform: scale(0.98); }
        .home-actions { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px; }
        /* Subject Grid */
        .subjects-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.8rem; margin-bottom: 20px; color: var(--accent); }
        .subjects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; width: 100%; }
        .subject-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent; position: relative; }
        .subject-card:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3); }
        .subject-card.locked { opacity: 0.5; cursor: not-allowed; }
        .subject-card.locked::after { content: '🔒'; position: absolute; top: 10px; right: 10px; font-size: 1.2rem; }
        .subject-emoji { font-size: 2.5rem; margin-bottom: 10px; }
        .subject-name { font-weight: bold; font-size: 1rem; margin-bottom: 5px; }
        .subject-progress { font-size: 0.8rem; color: rgba(255,255,255,0.6); }
        .subject-stars { color: var(--accent); font-size: 0.9rem; }
        /* Challenge List */
        .challenges-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.5rem; margin-bottom: 10px; text-align: center; }
        .challenges-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; margin-bottom: 20px; }
        .challenge-card { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 15px; cursor: pointer; transition: all 0.3s ease; border: 2px solid rgba(255,255,255,0.1); text-align: center; }
        .challenge-card:hover:not(.locked) { background: rgba(255,255,255,0.12); border-color: var(--secondary); transform: scale(1.02); }
        .challenge-card.locked { opacity: 0.4; cursor: not-allowed; }
        .challenge-card.completed { border-color: var(--success); }
        .challenge-emoji { font-size: 1.8rem; margin-bottom: 8px; }
        .challenge-name { font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
        .challenge-info { font-size: 0.75rem; color: rgba(255,255,255,0.6); }
        .challenge-stars { margin-top: 5px; }
        /* Quiz Page */
        .quiz-header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 15px; }
        .lives { display: flex; gap: 5px; font-size: 1.3rem; }
        .life { transition: all 0.3s ease; }
        .life.lost { opacity: 0.2; transform: scale(0.7); }
        .timer { font-size: 1.3rem; font-weight: bold; color: var(--accent); }
        .timer.warning { color: var(--error); animation: timerPulse 0.5s infinite; }
        @keyframes timerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .progress-info { width: 100%; display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; color: rgba(255,255,255,0.7); }
        .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 25px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 10px; transition: width 0.5s ease; }
        .question-card { width: 100%; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 25px; text-align: center; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .question-type { font-size: 0.85rem; color: var(--secondary); margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; line-height: 1.5; margin-bottom: 5px; }
        .question-difficulty { font-size: 0.8rem; color: var(--accent); margin-top: 8px; }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
        .option-btn { padding: 15px; font-size: 1rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text); cursor: pointer; transition: all 0.3s ease; font-family: inherit; text-align: center; }
        .option-btn:hover:not(.disabled) { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .option-btn.disabled { cursor: not-allowed; }
        .option-btn.correct { background: var(--success); border-color: var(--success); animation: correctPop 0.5s ease; }
        @keyframes correctPop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .option-btn.wrong { background: var(--error); border-color: var(--error); animation: shake 0.5s ease; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
        .option-label { display: inline-block; width: 25px; height: 25px; line-height: 25px; background: rgba(255,255,255,0.15); border-radius: 50%; margin-right: 8px; font-weight: bold; font-size: 0.9rem; }
        /* Feedback */
        .feedback { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 25px 50px; border-radius: 20px; font-size: 1.8rem; font-weight: bold; z-index: 100; animation: feedbackPop 0.4s ease; display: none; }
        .feedback.show { display: block; }
        @keyframes feedbackPop { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.2); } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        .feedback.correct { background: var(--success); }
        .feedback.wrong { background: var(--error); }
        /* Result Page */
        .result-card { background: rgba(255,255,255,0.05); border-radius: 25px; padding: 30px; text-align: center; width: 100%; animation: resultSlide 0.6s ease; }
        @keyframes resultSlide { from { opacity: 0; transform: scale(0.8) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .result-emoji { font-size: 4rem; margin-bottom: 15px; }
        .result-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 2rem; margin-bottom: 10px; }
        .result-title.success { color: var(--success); }
        .result-title.fail { color: var(--error); }
        .result-stars { font-size: 2.5rem; margin: 15px 0; }
        .result-coins { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.5rem; color: var(--accent); margin: 15px 0; }
        .result-item { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.2rem; margin: 10px 0; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 10px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        /* Shop Page */
        .shop-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.8rem; color: var(--accent); margin-bottom: 20px; }
        .shop-section { width: 100%; margin-bottom: 25px; }
        .shop-section-title { font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .shop-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .shop-item { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; text-align: center; cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent; }
        .shop-item:hover:not(.owned) { border-color: var(--accent); transform: translateY(-3px); }
        .shop-item.owned { opacity: 0.5; cursor: not-allowed; background: rgba(0,206,201,0.1); border-color: var(--secondary); }
        .shop-item.affordable { border-color: rgba(255,255,255,0.2); }
        .shop-item-icon { font-size: 2.5rem; margin-bottom: 8px; }
        .shop-item-name { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; }
        .shop-item-price { font-size: 0.9rem; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 5px; }
        .shop-item-owned { font-size: 0.75rem; color: var(--secondary); margin-top: 5px; }
        .shop-item-rarity { font-size: 0.7rem; color: rgba(255,255,255,0.5); margin-top: 3px; }
        /* Collection Page */
        .collection-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.8rem; color: var(--accent); margin-bottom: 20px; }
        .collection-stats { width: 100%; display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.8rem; color: rgba(255,255,255,0.6); }
        .collection-section { width: 100%; margin-bottom: 20px; }
        .collection-section-title { font-size: 1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
        .collection-item { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; text-align: center; }
        .collection-item.locked { opacity: 0.3; }
        .collection-item-icon { font-size: 2rem; margin-bottom: 5px; }
        .collection-item-name { font-size: 0.7rem; color: rgba(255,255,255,0.7); }
        .collection-item-owned { font-size: 0.65rem; color: var(--success); }
        /* Celebration */
        .celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }
        .confetti { position: absolute; width: 12px; height: 12px; animation: confettiFall 2.5s ease-out forwards; }
        @keyframes confettiFall { 0% { transform: translateY(-50px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
        /* Toast */
        .toast { position: fixed; bottom: 30%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: white; padding: 15px 30px; border-radius: 10px; font-size: 1rem; z-index: 300; animation: toastShow 0.3s ease; display: none; }
        .toast.show { display: block; }
        @keyframes toastShow { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        /* Responsive */
        @media (max-width: 500px) {
            .home-title { font-size: 2.2rem; }
            .subjects-grid { grid-template-columns: repeat(2, 1fr); }
            .challenges-grid { grid-template-columns: 1fr; }
            .options-grid { grid-template-columns: 1fr; }
            .shop-items { grid-template-columns: repeat(2, 1fr); }
            .collection-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="celebration" id="celebration"></div>
    <div class="toast" id="toast"></div>
    <div class="feedback" id="feedback"></div>

    <div class="container">
        <!-- 首页 -->
        <div class="page active" id="homePage">
            <div class="home-icon">🎓</div>
            <h1 class="home-title">学习大闯关</h1>
            <p class="home-subtitle">收集奥特曼和三国人物，成为学习达人！</p>
            <div class="home-actions">
                <button class="btn btn-primary" onclick="showSubjects()">开始挑战</button>
                <button class="btn btn-secondary" onclick="showShop()">🎁 道具商店</button>
                <button class="btn btn-secondary" onclick="showCollection()">📦 我的收藏</button>
            </div>
        </div>

        <!-- 科目选择 -->
        <div class="page" id="subjectsPage">
            <div class="header-bar">
                <button class="back-btn" onclick="showHome()">← 返回</button>
                <div class="coins-display"><span class="coins-icon">🪙</span><span id="coinsHeader">0</span></div>
            </div>
            <h2 class="subjects-title">选择科目</h2>
            <div class="subjects-grid" id="subjectsGrid"></div>
        </div>

        <!-- 闯关选择 -->
        <div class="page" id="challengesPage">
            <div class="header-bar">
                <button class="back-btn" onclick="showSubjects()">← 返回</button>
                <div class="coins-display"><span class="coins-icon">🪙</span><span id="coinsChallenge">0</span></div>
            </div>
            <h2 class="challenges-title" id="challengesTitle"></h2>
            <div class="challenges-grid" id="challengesGrid"></div>
        </div>

        <!-- 答题页面 -->
        <div class="page" id="quizPage">
            <div class="header-bar">
                <button class="back-btn" onclick="confirmQuit()">✕</button>
                <div class="lives" id="lives"></div>
                <div class="timer" id="timer">30</div>
            </div>
            <div class="progress-info">
                <span id="challengeName">闯关名称</span>
                <span id="questionCount">1/3</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="question-card">
                <div class="question-type" id="questionType"></div>
                <div class="question-text" id="questionText"></div>
                <div class="question-difficulty" id="questionDifficulty"></div>
            </div>
            <div class="options-grid" id="optionsGrid"></div>
        </div>

        <!-- 结果页面 -->
        <div class="page" id="resultPage">
            <div class="result-card">
                <div class="result-emoji" id="resultEmoji">🏆</div>
                <h2 class="result-title" id="resultTitle">挑战完成!</h2>
                <div class="result-stars" id="resultStars">⭐⭐⭐</div>
                <div class="result-coins"><span>🪙</span><span id="resultCoins">+150</span></div>
                <div class="result-item" id="resultItem" style="display:none"><span id="resultItemIcon"></span><span id="resultItemName"></span></div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="showSubjects()">选择科目</button>
                    <button class="btn btn-secondary" onclick="showHome()">返回首页</button>
                </div>
            </div>
        </div>

        <!-- 商店页面 -->
        <div class="page" id="shopPage">
            <div class="header-bar">
                <button class="back-btn" onclick="showHome()">← 返回</button>
                <div class="coins-display"><span class="coins-icon">🪙</span><span id="coinsShop">0</span></div>
            </div>
            <h2 class="shop-title">🎁 道具商店</h2>
            <div class="shop-section">
                <div class="shop-section-title">⚡ 奥特曼系列</div>
                <div class="shop-items" id="ultramanShop"></div>
            </div>
            <div class="shop-section">
                <div class="shop-section-title">🏮 三国系列</div>
                <div class="shop-items" id="threeKingdomsShop"></div>
            </div>
            <div class="shop-section">
                <div class="shop-section-title">🎮 特殊道具</div>
                <div class="shop-items" id="specialShop"></div>
            </div>
        </div>

        <!-- 收藏页面 -->
        <div class="page" id="collectionPage">
            <div class="header-bar">
                <button class="back-btn" onclick="showHome()">← 返回</button>
                <div class="coins-display"><span class="coins-icon">🪙</span><span id="coinsCollection">0</span></div>
            </div>
            <h2 class="collection-title">📦 我的收藏</h2>
            <div class="collection-stats">
                <div class="stat-card"><div class="stat-value" id="totalItems">0</div><div class="stat-label">已收集</div></div>
                <div class="stat-card"><div class="stat-value" id="totalStars">0</div><div class="stat-label">获得星星</div></div>
            </div>
            <div class="collection-section">
                <div class="collection-section-title">⚡ 奥特曼系列 <span id="ultramanCount">0/6</span></div>
                <div class="collection-grid" id="ultramanCollection"></div>
            </div>
            <div class="collection-section">
                <div class="collection-section-title">🏮 三国系列 <span id="threeKingdomsCount">0/7</span></div>
                <div class="collection-grid" id="threeKingdomsCollection"></div>
            </div>
        </div>
    </div>

<script>
// ==================== 道具数据 ====================
const ultramanItems = [
    { id: 'ultra_1', name: '奥特曼胶囊', icon: '💊', price: 100, rarity: '⭐' },
    { id: 'ultra_2', name: '怪兽胶囊', icon: '👾', price: 80, rarity: '⭐' },
    { id: 'ultra_3', name: '变身器', icon: '⚡', price: 200, rarity: '⭐⭐' },
    { id: 'ultra_4', name: '迪迦之光', icon: '🌟', price: 300, rarity: '⭐⭐⭐' },
    { id: 'ultra_5', name: '银河剑', icon: '🗡️', price: 500, rarity: '⭐⭐⭐⭐' },
    { id: 'ultra_6', name: '诺亚之力', icon: '🔥', price: 1000, rarity: '⭐⭐⭐⭐⭐' }
];

const threeKingdomsItems = [
    { id: 'tk_1', name: '青铜剑', icon: '⚔️', price: 100, rarity: '⭐' },
    { id: 'tk_2', name: '青龙刀', icon: '🔪', price: 80, rarity: '⭐' },
    { id: 'tk_3', name: '丈八蛇矛', icon: '🔱', price: 120, rarity: '⭐⭐' },
    { id: 'tk_4', name: '双股剑', icon: '⚔️', price: 150, rarity: '⭐⭐' },
    { id: 'tk_5', name: '诸葛扇', icon: '🪭', price: 300, rarity: '⭐⭐⭐' },
    { id: 'tk_6', name: '赤兔马', icon: '🏇', price: 500, rarity: '⭐⭐⭐⭐' },
    { id: 'tk_7', name: '青龙偃月刀', icon: '🗡️', price: 1000, rarity: '⭐⭐⭐⭐⭐' }
];

const specialItems = [
    { id: 'special_1', name: '续命符', icon: '❤️', price: 50, rarity: '道具' },
    { id: 'special_2', name: '双倍卡', icon: '✨', price: 30, rarity: '道具' },
    { id: 'special_3', name: '跳过卡', icon: '⏭️', price: 20, rarity: '道具' }
];

// ==================== 科目和闯关数据 ====================
const subjects = {
    '语文乐园': {

// ==================== 游戏状态 ====================
let gameState = {
    coins: 0,
    currentSubject: null,
    currentChallenge: null,
    currentQuestion: 0,
    lives: 3,
    score: 0,
    correctCount: 0,
    streak: 0,
    questions: [],
    timerInterval: null,
    unlockedChallenges: ['拼音小达人'],
    challengeStars: {},
    collectedItems: []
};

// 难度奖励配置
const difficultyRewards = { easy: 10, medium: 20, hard: 30 };

// ==================== 数据持久化 ====================
function loadGameData() {
    const saved = localStorage.getItem('learningChallenge_v2');
    if (saved) {
        const data = JSON.parse(saved);
        gameState.coins = data.coins || 0;
        gameState.unlockedChallenges = data.unlockedChallenges || ['拼音小达人'];
        gameState.challengeStars = data.challengeStars || {};
        gameState.collectedItems = data.collectedItems || [];
    }
}

function saveGameData() {
    const data = {
        coins: gameState.coins,
        unlockedChallenges: gameState.unlockedChallenges,
        challengeStars: gameState.challengeStars,
        collectedItems: gameState.collectedItems
    };
    localStorage.setItem('learningChallenge_v2', JSON.stringify(data));
}

// ==================== 界面切换 ====================
function showPage(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}

function showHome() { showPage('homePage'); }

function updateCoinsDisplay() {
    const displays = ['coinsHeader', 'coinsChallenge', 'coinsShop', 'coinsCollection'];
    displays.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = gameState.coins;
    });
}

function showSubjects() {
    loadGameData();
    updateCoinsDisplay();
    renderSubjects();
    showPage('subjectsPage');
}

function showShop() {
    loadGameData();
    updateCoinsDisplay();
    renderShop();
    showPage('shopPage');
}

function showCollection() {
    loadGameData();
    updateCoinsDisplay();
    renderCollection();
    showPage('collectionPage');
}

// ==================== 渲染科目 ====================
function renderSubjects() {
    const grid = document.getElementById('subjectsGrid');
    grid.innerHTML = '';
    Object.entries(subjects).forEach(([name, data]) => {
        const card = document.createElement('div');
        card.className = 'subject-card';
        card.innerHTML = `
            <div class="subject-emoji">${data.emoji}</div>
            <div class="subject-name">${name}</div>
            <div class="subject-stars">${getSubjectStars(name)} ⭐</div>
        `;
        card.onclick = () => showChallenges(name);
        grid.appendChild(card);
    });
}

function getSubjectStars(subjectName) {
    const subjectChallenges = Object.keys(subjects[subjectName].challenges);
    let totalStars = 0;
    subjectChallenges.forEach(c => {
        totalStars += gameState.challengeStars[c] || 0;
    });
    return totalStars;
}

// ==================== 渲染闯关列表 ====================
function showChallenges(subjectName) {
    gameState.currentSubject = subjectName;
    document.getElementById('challengesTitle').textContent = `${subjects[subjectName].emoji} ${subjectName}`;
    updateCoinsDisplay();
    renderChallenges();
    showPage('challengesPage');
}

function renderChallenges() {
    const grid = document.getElementById('challengesGrid');
    grid.innerHTML = '';
    const challenges = subjects[gameState.currentSubject].challenges;
    Object.entries(challenges).forEach(([name, data]) => {
        const card = document.createElement('div');
        const isLocked = !gameState.unlockedChallenges.includes(name);
        const stars = gameState.challengeStars[name] || 0;
        card.className = 'challenge-card' + (isLocked ? ' locked' : '') + (stars > 0 ? ' completed' : '');
        card.innerHTML = `
            <div class="challenge-emoji">${data.emoji}</div>
            <div class="challenge-name">${name}</div>
            <div class="challenge-info">${isLocked ? '🔒 未解锁' : getDifficultyText(data.difficulty)}</div>
            <div class="challenge-stars">${'⭐'.repeat(stars)}</div>
        `;
        if (!isLocked) card.onclick = () => startChallenge(name, data);
        grid.appendChild(card);
    });
}

function getDifficultyText(diff) {
    const map = { easy: '⭐简单', medium: '⭐⭐中等', hard: '⭐⭐⭐困难' };
    return map[diff] || diff;
}

// ==================== 开始闯关 ====================
function startChallenge(challengeName, challengeData) {
    gameState.currentChallenge = challengeName;
    gameState.currentQuestion = 0;
    gameState.lives = 3;
    gameState.score = 0;
    gameState.correctCount = 0;
    gameState.streak = 0;
    gameState.timeLimit = challengeData.time;
    gameState.difficulty = challengeData.difficulty;

    // 随机抽取3题
    const allQuestions = questionBank[challengeName] || [];
    gameState.questions = shuffleArray([...allQuestions]).slice(0, 3);

    document.getElementById('challengeName').textContent = challengeName;
    showPage('quizPage');
    renderQuiz();
}

function renderQuiz() {
    const q = gameState.questions[gameState.currentQuestion];
    const progress = (gameState.currentQuestion / gameState.questions.length) * 100;

    document.getElementById('progressFill').style.width = `${progress}%`;
    document.getElementById('questionCount').textContent = `${gameState.currentQuestion + 1}/${gameState.questions.length}`;
    document.getElementById('questionType').textContent = gameState.currentChallenge;
    document.getElementById('questionText').textContent = q.q;
    document.getElementById('questionDifficulty').textContent = getDifficultyText(q.d);

    renderLives();
    renderOptions(q);
    startTimer();
}

function renderLives() {
    const container = document.getElementById('lives');
    container.innerHTML = '';
    for (let i = 0; i < 3; i++) {
        const life = document.createElement('span');
        life.className = 'life' + (i >= gameState.lives ? ' lost' : '');
        life.textContent = '❤️';
        container.appendChild(life);
    }
}

function renderOptions(q) {
    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';
    const labels = ['A', 'B', 'C', 'D'];
    q.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-label">${labels[i]}</span>${opt}`;
        btn.onclick = () => selectAnswer(i, q);
        grid.appendChild(btn);
    });
}

function startTimer() {
    clearInterval(gameState.timerInterval);
    let timeLeft = gameState.timeLimit;
    const timerEl = document.getElementById('timer');
    timerEl.textContent = timeLeft;
    timerEl.classList.remove('warning');

    gameState.timerInterval = setInterval(() => {
        timeLeft--;
        timerEl.textContent = timeLeft;
        if (timeLeft <= 5) timerEl.classList.add('warning');
        if (timeLeft <= 0) { clearInterval(gameState.timerInterval); handleTimeout(); }
    }, 1000);
}

function handleTimeout() {
    showFeedback(false);
    gameState.lives--;
    gameState.streak = 0;
    renderLives();
    setTimeout(() => {
        if (gameState.lives <= 0) endChallenge(false);
        else nextQuestion();
    }, 1200);
}

function selectAnswer(index, question) {
    clearInterval(gameState.timerInterval);
    const isCorrect = index === question.a;
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.classList.add('disabled'));

    if (isCorrect) {
        buttons[index].classList.add('correct');
        showFeedback(true);
        gameState.correctCount++;
        gameState.streak++;
        const baseReward = difficultyRewards[question.d] || 10;
        const streakBonus = (gameState.streak - 1) * 5;
        gameState.score += baseReward + streakBonus;
        createCelebration(8);
    } else {
        buttons[index].classList.add('wrong');
        buttons[question.a].classList.add('correct');
        showFeedback(false);
        gameState.lives--;
        gameState.streak = 0;
        renderLives();
    }

    setTimeout(() => {
        if (gameState.lives <= 0) endChallenge(false);
        else if (gameState.currentQuestion >= gameState.questions.length - 1) endChallenge(true);
        else nextQuestion();
    }, 1200);
}

function nextQuestion() {
    gameState.currentQuestion++;
    renderQuiz();
}

// ==================== 结束闯关 ====================
function endChallenge(success) {
    clearInterval(gameState.timerInterval);
    clearCelebration();

    const stars = success ? gameState.correctCount : 0;
    const challengeName = gameState.currentChallenge;

    // 更新最高星级
    if (!gameState.challengeStars[challengeName] || stars > gameState.challengeStars[challengeName]) {
        gameState.challengeStars[challengeName] = stars;
    }

    // 计算金币奖励
    let coinReward = success ? stars * 30 : 10;
    gameState.coins += coinReward;

    // 解锁下一个闯关
    const allChallenges = Object.keys(subjects[gameState.currentSubject].challenges);
    const currentIndex = allChallenges.indexOf(challengeName);
    if (currentIndex < allChallenges.length - 1) {
        const nextChallenge = allChallenges[currentIndex + 1];
        if (!gameState.unlockedChallenges.includes(nextChallenge)) {
            gameState.unlockedChallenges.push(nextChallenge);
        }
    }

    // 首次通关给道具
    let newItem = null;
    if (success && stars >= 1 && Math.random() < 0.3) {
        newItem = getRandomItem();
        if (newItem && !gameState.collectedItems.includes(newItem.id)) {
            gameState.collectedItems.push(newItem.id);
            coinReward += 20;
        }
    }

    saveGameData();

    // 显示结果
    document.getElementById('resultEmoji').textContent = success ? '🏆' : '💔';
    document.getElementById('resultTitle').textContent = success ? '挑战成功!' : '挑战失败';
    document.getElementById('resultTitle').className = 'result-title ' + (success ? 'success' : 'fail');
    document.getElementById('resultStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    document.getElementById('resultCoins').textContent = '+' + coinReward;

    const itemEl = document.getElementById('resultItem');
    if (newItem) {
        itemEl.style.display = 'flex';
        document.getElementById('resultItemIcon').textContent = newItem.icon;
        document.getElementById('resultItemName').textContent = '获得 ' + newItem.name;
    } else {
        itemEl.style.display = 'none';
    }

    if (success && stars >= 1) createMassiveCelebration();
    showPage('resultPage');
}

function getRandomItem() {
    const allItems = [...ultramanItems, ...threeKingdomsItems];
    const randomIndex = Math.floor(Math.random() * allItems.length);
    return allItems[randomIndex];
}

// ==================== 商店 ====================
function renderShop() {
    renderShopSection('ultramanShop', ultramanItems);
    renderShopSection('threeKingdomsShop', threeKingdomsItems);
    renderShopSection('specialShop', specialItems);
}

function renderShopSection(containerId, items) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    items.forEach(item => {
        const owned = gameState.collectedItems.includes(item.id);
        const affordable = gameState.coins >= item.price;
        const div = document.createElement('div');
        div.className = 'shop-item' + (owned ? ' owned' : '') + (affordable && !owned ? ' affordable' : '');
        div.innerHTML = `
            <div class="shop-item-icon">${item.icon}</div>
            <div class="shop-item-name">${item.name}</div>
            <div class="shop-item-price">🪙 ${item.price}</div>
            <div class="shop-item-rarity">${item.rarity}</div>
            ${owned ? '<div class="shop-item-owned">已拥有</div>' : ''}
        `;
        if (!owned && affordable) {
            div.onclick = () => buyItem(item);
        }
        container.appendChild(div);
    });
}

function buyItem(item) {
    if (gameState.coins < item.price) {
        showToast('金币不足!');
        return;
    }
    if (gameState.collectedItems.includes(item.id)) {
        showToast('已拥有!');
        return;
    }
    gameState.coins -= item.price;
    gameState.collectedItems.push(item.id);
    saveGameData();
    updateCoinsDisplay();
    renderShop();
    showToast(`获得 ${item.icon} ${item.name}!`);
    createMassiveCelebration();
}

// ==================== 收藏 ====================
function renderCollection() {
    document.getElementById('totalItems').textContent = gameState.collectedItems.length;
    let totalStars = 0;
    Object.values(gameState.challengeStars).forEach(s => totalStars += s);
    document.getElementById('totalStars').textContent = totalStars;

    renderCollectionSection('ultramanCollection', ultramanItems, 'ultramanCount');
    renderCollectionSection('threeKingdomsCollection', threeKingdomsItems, 'threeKingdomsCount');
}

function renderCollectionSection(containerId, items, countId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    let ownedCount = 0;
    items.forEach(item => {
        const owned = gameState.collectedItems.includes(item.id);
        if (owned) ownedCount++;
        const div = document.createElement('div');
        div.className = 'collection-item' + (owned ? '' : ' locked');
        div.innerHTML = `
            <div class="collection-item-icon">${owned ? item.icon : '❓'}</div>
            <div class="collection-item-name">${owned ? item.name : '???'}</div>
            ${owned ? '<div class="collection-item-owned">✓</div>' : ''}
        `;
        container.appendChild(div);
    });
    document.getElementById(countId).textContent = `${ownedCount}/${items.length}`;
}

// ==================== 工具函数 ====================
function showFeedback(isCorrect) {
    const el = document.getElementById('feedback');
    el.textContent = isCorrect ? '正确! 🎉' : '错误! 😢';
    el.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong') + ' show';
    setTimeout(() => el.classList.remove('show'), 1000);
}

function showToast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2000);
}

function createCelebration(count) {
    const container = document.getElementById('celebration');
    const colors = ['#FF6B6B', '#26DE81', '#FDCB6E', '#6C5CE7', '#00CEC9'];
    for (let i = 0; i < count; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + '%';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.animationDelay = Math.random() * 0.3 + 's';
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        container.appendChild(c);
        setTimeout(() => c.remove(), 2500);
    }
}

function createMassiveCelebration() {
    createCelebration(50);
}

function clearCelebration() {
    document.getElementById('celebration').innerHTML = '';
}

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function confirmQuit() {
    if (confirm('确定要退出挑战吗？')) {
        clearInterval(gameState.timerInterval);
        showSubjects();
    }
}

function createParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 15 + 's';
        p.style.animationDuration = (10 + Math.random() * 10) + 's';
        container.appendChild(p);
    }
}

// ==================== 初始化 ====================
function init() {
    loadGameData();
    createParticles();
}

init();

// PWA Service Worker
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    });
}
</script>
