<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C5CE7">
    <title>学习大闯关</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6C5CE7;
            --secondary: #00CEC9;
            --accent: #FDCB6E;
            --bg-dark: #1A1A2E;
            --bg-light: #16213E;
            --text: #FFFFFF;
            --error: #FF6B6B;
            --success: #26DE81;
            --energy-lit: #9370DB;
            --energy-wis: #4169E1;
            --energy-com: #FFD700;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-light));
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 10px; min-height: 100vh; }
        .page { display: none; animation: fadeIn 0.3s; }
        .page.active { display: flex; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }

        .header { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 15px; flex-wrap: wrap; gap: 8px; }
        .energy-bar { display: flex; gap: 8px; flex-wrap: wrap; }
        .energy-item { font-size: 0.9rem; font-weight: bold; }
        .stat-info { font-size: 0.85rem; }

        .btn { padding: 12px 20px; font-size: 1rem; font-weight: bold; border: none; border-radius: 20px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 2px solid rgba(255,255,255,0.2); }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .title { font-size: 1.8rem; text-align: center; margin: 15px 0; color: var(--accent); }

        .subject-btns { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .subject-btn { padding: 15px 25px; border-radius: 15px; border: none; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .subject-btn.lit { background: var(--energy-lit); }
        .subject-btn.wis { background: var(--energy-wis); }
        .subject-btn.com { background: var(--energy-com); color: #333; }
        .subject-btn.selected { transform: scale(1.05); box-shadow: 0 0 15px rgba(255,255,255,0.3); }

        .quiz-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; margin: 15px 0; text-align: center; }
        .question-text { font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option { padding: 15px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; cursor: pointer; transition: all 0.2s; text-align: center; font-size: 0.95rem; }
        .option:hover:not(.disabled) { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .option.correct { background: var(--success); border-color: var(--success); }
        .option.wrong { background: var(--error); border-color: var(--error); }
        .option.disabled { cursor: not-allowed; }

        .feedback { text-align: center; font-size: 1.3rem; margin: 10px 0; font-weight: bold; }
        .feedback.correct { color: var(--success); }
        .feedback.wrong { color: var(--error); }

        /* ============== TOWER / CITY GATE ============== */
        .tower-wrapper {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }
        /* City Gate Structure */
        .city-gate {
            position: relative;
            width: 80px;
            height: 120px;
        }
        .gate-main {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 90px;
            background: linear-gradient(180deg, #5a5a7a, #3a3a5a);
            border-radius: 5px 5px 0 0;
            border: 2px solid #6a6a8a;
        }
        .gate-main::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 50px;
            background: linear-gradient(180deg, #2a2a3a, #1a1a2a);
            border-radius: 3px 3px 0 0;
            border: 2px solid #4a4a6a;
        }
        .gate-main::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 45px;
            background: #6a6a8a;
            border-radius: 2px;
        }
        /* Battlements on top */
        .battlement {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 20px;
            display: flex;
            justify-content: space-between;
        }
        .battlement::before,
        .battlement::after {
            content: '';
            position: absolute;
            top: 0;
            width: 12px;
            height: 20px;
            background: #5a5a7a;
            border: 1px solid #6a6a8a;
        }
        .battlement::before { left: 0; border-radius: 2px 2px 0 0; }
        .battlement::after { right: 0; border-radius: 2px 2px 0 0; }
        .battlement-center {
            display: flex;
            gap: 4px;
            justify-content: center;
        }
        .battlement-center span {
            width: 10px;
            height: 20px;
            background: #5a5a7a;
            border: 1px solid #6a6a8a;
            border-radius: 2px 2px 0 0;
        }
        /* Side towers */
        .side-tower {
            position: absolute;
            bottom: 0;
            width: 25px;
            height: 60px;
            background: linear-gradient(180deg, #4a4a6a, #2a2a4a);
            border-radius: 3px 3px 0 0;
        }
        .side-tower.left { left: -5px; }
        .side-tower.right { right: -5px; }
        .side-tower::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 15px solid #5a5a7a;
        }
        /* Tower HP bar */
        .tower-hp-container {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }
        .tower-hp-bar {
            width: 60px;
            height: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            margin: 0 auto;
        }
        .tower-hp-fill { height: 100%; background: var(--success); transition: width 0.3s; }
        .tower-hp-text { font-size: 0.65rem; margin-top: 2px; }

        /* ============== ENEMY SPRITES ============== */
        .enemy-sprite {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: left 0.5s linear;
        }
        .enemy-body {
            position: relative;
            width: 40px;
            height: 55px;
        }
        /* Enemy head */
        .enemy-head {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
        }
        /* Enemy torso */
        .enemy-torso {
            width: 30px;
            height: 25px;
            border-radius: 8px 8px 5px 5px;
            margin: 2px auto 0;
            position: relative;
        }
        /* Enemy legs */
        .enemy-legs {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-top: 2px;
        }
        .enemy-leg {
            width: 8px;
            height: 10px;
            border-radius: 3px;
        }
        /* Weakness glow */
        .enemy-body.lit .enemy-head { box-shadow: 0 0 10px var(--energy-lit); }
        .enemy-body.wis .enemy-head { box-shadow: 0 0 10px var(--energy-wis); }
        .enemy-body.com .enemy-head { box-shadow: 0 0 10px var(--energy-com); }
        .enemy-body.none .enemy-head { box-shadow: 0 0 10px var(--error); }

        .enemy-name { font-size: 0.7rem; margin-top: 4px; color: rgba(255,255,255,0.8); text-align: center; }
        .enemy-hp-bar {
            width: 40px;
            height: 5px;
            background: rgba(0,0,0,0.5);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 3px;
        }
        .enemy-hp-fill { height: 100%; background: var(--success); transition: width 0.3s; }
        .enemy-hp-text { font-size: 0.6rem; text-align: center; color: rgba(255,255,255,0.6); margin-top: 1px; }
        .enemy-weakness-badge {
            font-size: 0.55rem;
            padding: 1px 4px;
            border-radius: 4px;
            margin-top: 2px;
        }
        .enemy-weakness-badge.lit { background: var(--energy-lit); }
        .enemy-weakness-badge.wis { background: var(--energy-wis); }
        .enemy-weakness-badge.com { background: var(--energy-com); color: #333; }

        /* Enemy type specific colors */
        .enemy-body.confusion .enemy-head { background: linear-gradient(135deg, #9370DB, #7B68EE); }
        .enemy-body.confusion .enemy-torso { background: linear-gradient(180deg, #9370DB, #6A5ACD); }
        .enemy-body.confusion .enemy-leg { background: #6A5ACD; }

        .enemy-body.chaos .enemy-head { background: linear-gradient(135deg, #4169E1, #1E90FF); }
        .enemy-body.chaos .enemy-torso { background: linear-gradient(180deg, #4169E1, #2E5BB0); }
        .enemy-body.chaos .enemy-leg { background: #2E5BB0; }

        .enemy-body.foolish .enemy-head { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .enemy-body.foolish .enemy-torso { background: linear-gradient(180deg, #FFD700, #E69500); }
        .enemy-body.foolish .enemy-leg { background: #E69500; }

        .enemy-body.greed .enemy-head { background: linear-gradient(135deg, #FF6B6B, #EE5A5A); }
        .enemy-body.greed .enemy-torso { background: linear-gradient(180deg, #FF6B6B, #CC4444); }
        .enemy-body.greed .enemy-leg { background: #CC4444; }

        .enemy-body.stone .enemy-head { background: linear-gradient(135deg, #8B7355, #6B5344); }
        .enemy-body.stone .enemy-torso { background: linear-gradient(180deg, #8B7355, #5B4334); }
        .enemy-body.stone .enemy-leg { background: #5B4334; }

        /* ============== HERO SPRITES ============== */
        .hero-sprite {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hero-body {
            position: relative;
            width: 50px;
            height: 70px;
        }
        .hero-head {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }
        .hero-torso {
            width: 36px;
            height: 30px;
            border-radius: 10px 10px 8px 8px;
            margin: 3px auto 0;
        }
        .hero-legs {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .hero-leg {
            width: 10px;
            height: 14px;
            border-radius: 4px;
        }
        /* Hero rarity colors */
        .hero-body.rarity-3 .hero-head { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .hero-body.rarity-3 .hero-torso { background: linear-gradient(180deg, #FFD700, #CC8800); }
        .hero-body.rarity-3 .hero-leg { background: #CC8800; }

        .hero-body.rarity-2 .hero-head { background: linear-gradient(135deg, #C0C0C0, #A0A0A0); }
        .hero-body.rarity-2 .hero-torso { background: linear-gradient(180deg, #C0C0C0, #808080); }
        .hero-body.rarity-2 .hero-leg { background: #808080; }

        .hero-body.rarity-1 .hero-head { background: linear-gradient(135deg, #CD7F32, #8B4513); }
        .hero-body.rarity-1 .hero-torso { background: linear-gradient(180deg, #CD7F32, #6B3300); }
        .hero-body.rarity-1 .hero-leg { background: #6B3300; }

        /* Element glow for heroes */
        .hero-body.lit .hero-head { box-shadow: 0 0 8px var(--energy-lit); }
        .hero-body.wis .hero-head { box-shadow: 0 0 8px var(--energy-wis); }
        .hero-body.com .hero-head { box-shadow: 0 0 8px var(--energy-com); }

        .hero-name { font-size: 0.8rem; margin-top: 6px; font-weight: bold; }

        .skill-bar { background: rgba(255,255,255,0.1); height: 30px; border-radius: 15px; margin: 15px 0; overflow: hidden; position: relative; }
        .skill-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.3s; }
        .skill-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 0.85rem; font-weight: bold; }

        .log { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; font-size: 0.8rem; max-height: 80px; overflow-y: auto; margin: 10px 0; }
        .log-entry { padding: 2px 0; }
        .log-damage { color: var(--error); }
        .log-heal { color: var(--success); }

        .wave-info { text-align: center; font-size: 0.9rem; color: var(--secondary); margin: 10px 0; }

        .menu-grid { display: grid; gap: 15px; margin: 20px 0; }
        .menu-btn { padding: 20px; font-size: 1.1rem; border-radius: 15px; }
        .energy-summary { display: flex; justify-content: center; gap: 20px; margin: 15px 0; font-size: 1.1rem; font-weight: bold; }

        .result-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; }
        .result-card { background: var(--bg-light); border-radius: 20px; padding: 30px; text-align: center; }
        .result-emoji { font-size: 4rem; }
        .result-title { font-size: 1.5rem; margin: 15px 0; }
        .result-title.victory { color: var(--success); }
        .result-title.defeat { color: var(--error); }

        /* Hero Team Selection */
        .hero-section { margin: 15px 0; }
        .hero-section-title { font-size: 1rem; color: var(--accent); margin-bottom: 10px; text-align: center; }
        .hero-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 15px; }
        .hero-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
            min-height: 140px;
        }
        .hero-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); }
        .hero-card.on-team { border-color: var(--success); background: rgba(38,222,129,0.15); }

        /* Hero Avatar - CSS based portrait */
        /* ============== HERO SPRITES (HUMANOID) ============== */
        .hero-sprite {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
        }
        .hero-body {
            position: relative;
            width: 50px;
            height: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Hat / Headwear */
        .hero-hat {
            width: 30px;
            height: 10px;
            border-radius: 3px 3px 0 0;
            position: relative;
            z-index: 2;
        }
        /* Head */
        .hero-head {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-face {
            width: 20px;
            height: 18px;
            border-radius: 50% 50% 45% 45%;
            position: absolute;
            top: 3px;
        }
        /* Torso with arms */
        .hero-torso {
            width: 30px;
            height: 28px;
            border-radius: 6px 6px 4px 4px;
            position: relative;
            margin-top: 2px;
        }
        .hero-arm {
            position: absolute;
            width: 8px;
            height: 20px;
            border-radius: 4px;
            top: 0;
        }
        .hero-arm.left { left: -6px; transform: rotate(15deg); }
        .hero-arm.right { right: -6px; transform: rotate(-15deg); }
        /* Legs */
        .hero-legs {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 2px;
        }
        .hero-leg {
            width: 10px;
            height: 14px;
            border-radius: 3px 3px 4px 4px;
        }
        /* Weapon displayed beside */
        .hero-weapon {
            position: absolute;
            right: -5px;
            top: 15px;
            font-size: 1rem;
        }
        /* Rarity border glow */
        .hero-card[data-rarity="3"] .hero-body { filter: drop-shadow(0 0 5px #FFD700); }
        .hero-card[data-rarity="2"] .hero-body { filter: drop-shadow(0 0 5px #C0C0C0); }
        .hero-card[data-rarity="1"] .hero-body { filter: drop-shadow(0 0 5px #CD7F32); }

        .hero-name { font-size: 0.8rem; margin-top: 6px; font-weight: bold; }
        .hero-bonus { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; display: inline-block; }
        .hero-bonus.lit { background: var(--energy-lit); }
        .hero-bonus.wis { background: var(--energy-wis); }
        .hero-bonus.com { background: var(--energy-com); color: #333; }
        .hero-skill { font-size: 0.6rem; color: rgba(255,255,255,0.6); margin-top: 3px; }

        .team-info { text-align: center; font-size: 0.9rem; color: var(--secondary); margin: 10px 0; }
        .team-bonus { font-size: 0.8rem; color: var(--accent); margin-top: 5px; }

        .equipped-heroes { display: flex; gap: 10px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
        .equipped-hero {
            background: rgba(255,255,255,0.1);
            padding: 8px 14px;
            border-radius: 25px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .equipped-hero .hero-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .equipped-hero .hero-avatar-small::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .equipped-hero .hero-avatar-small .hero-icon {
            font-size: 0.8rem;
        }
        .equipped-hero .remove { cursor: pointer; color: var(--error); font-size: 1.1rem; margin-left: 4px; }

        @media (max-width: 500px) {
            .title { font-size: 1.5rem; }
            .subject-btns { flex-direction: column; }
            .subject-btn { width: 100%; }
            .options { grid-template-columns: 1fr; }
            .hero-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Menu Page -->
        <div class="page active" id="menuPage">
            <h1 class="title">🏯 学习大闯关</h1>
            <div class="energy-summary">
                <span style="color:var(--energy-lit)">💜<span id="menuLit">0</span></span>
                <span style="color:var(--energy-wis)">💙<span id="menuWis">0</span></span>
                <span style="color:var(--energy-com)">💛<span id="menuCom">0</span></span>
                <span style="color:var(--accent)">⚡<span id="menuTotal">0</span></span>
            </div>
            <div class="menu-grid">
                <button class="btn btn-primary menu-btn" onclick="showTeamSelect()">🎯 选择角色</button>
                <button class="btn btn-primary menu-btn" onclick="showQuiz()">📝 开始答题</button>
                <button class="btn btn-secondary menu-btn" id="defenseBtn" onclick="showDefense()" disabled>🏯 守塔战斗 (需要≥10能量)</button>
            </div>
            <div style="text-align:center;margin-top:20px;color:rgba(255,255,255,0.5);font-size:0.85rem;">
                第 <span id="menuChapter">1</span> 章 · 第 <span id="menuLevel">1</span> 关
            </div>
        </div>

        <!-- Hero Team Selection Page -->
        <div class="page" id="teamPage">
            <h1 class="title">🎯 上阵角色</h1>
            <div class="team-info">
                已上阵: <span id="teamCount">0</span>/3
            </div>
            <div class="equipped-heroes" id="equippedList"></div>
            <div class="team-bonus" id="teamBonus"></div>

            <div class="hero-section">
                <div class="hero-grid" id="heroGrid"></div>
            </div>

            <div style="text-align:center;margin-top:15px;">
                <button class="btn btn-secondary" onclick="showMenu()">← 返回</button>
                <button class="btn btn-primary" onclick="showQuiz()" style="margin-left:10px;">📝 开始答题</button>
            </div>
        </div>

        <!-- Quiz Page -->
        <div class="page" id="quizPage">
            <div class="header">
                <div class="energy-bar">
                    <span class="energy-item" style="color:var(--energy-lit)">💜<span id="quizLit">0</span></span>
                    <span class="energy-item" style="color:var(--energy-wis)">💙<span id="quizWis">0</span></span>
                    <span class="energy-item" style="color:var(--energy-com)">💛<span id="quizCom">0</span></span>
                </div>
                <div class="stat-info">
                    连击: <span id="streak">0</span>题
                </div>
            </div>

            <div class="subject-btns">
                <button class="subject-btn lit" onclick="selectSubject('chinese')">📖 语文</button>
                <button class="subject-btn wis" onclick="selectSubject('math')">🔢 数学</button>
                <button class="subject-btn com" onclick="selectSubject('english')">🔤 英语</button>
            </div>

// ==================== GAME STATE ====================
let gameState = {
    literature: 0, wisdom: 0, communication: 0,
    streak: 0, totalCorrect: 0,
    chapter: 1, level: 1, maxUnlocked: 1,
    team: [] // 上阵角色ID列表
};

// ==================== NAVIGATION ====================
const pages = {menu: document.getElementById('menuPage'), team: document.getElementById('teamPage'), quiz: document.getElementById('quizPage'), defense: document.getElementById('defensePage')};

function showPage(pageId) {
    Object.values(pages).forEach(p => p.classList.remove('active'));
    document.getElementById(pageId + 'Page').classList.add('active');
}
function showMenu() { showPage('menu'); updateMenuUI(); }
function showTeamSelect() { showPage('team'); renderHeroGrid(); }
function showQuiz() { showPage('quiz'); updateQuizUI(); loadQuestion(); }
function showDefense() { showPage('defense'); updateDefenseUI(); startBattle(); }

// ==================== HERO TEAM ====================
function renderHeroGrid() {
    const grid = document.getElementById('heroGrid');
    grid.innerHTML = '';
    HEROES.forEach(hero => {
        const isOnTeam = gameState.team.includes(hero.id);
        const div = document.createElement('div');
        div.className = 'hero-card' + (isOnTeam ? ' on-team' : '');
        div.setAttribute('data-rarity', hero.rarity);
        div.innerHTML = `
            <div class="hero-sprite">
                <div class="hero-body">
                    <div class="hero-hat" style="background:${hero.hat}"></div>
                    <div class="hero-head">
                        <div class="hero-face" style="background:${hero.face}"></div>
                    </div>
                    <div class="hero-torso" style="background:linear-gradient(180deg,${hero.outfit},${darkenColor(hero.outfit)})">
                        <div class="hero-arm left" style="background:${hero.outfit}"></div>
                        <div class="hero-arm right" style="background:${hero.outfit}"></div>
                    </div>
                    <div class="hero-legs">
                        <div class="hero-leg" style="background:${hero.outfit}"></div>
                        <div class="hero-leg" style="background:${hero.outfit}"></div>
                    </div>
                </div>
                <div class="hero-weapon">${hero.weapon}</div>
            </div>
            <div class="hero-name">${hero.name}</div>
            <span class="hero-bonus ${hero.bonus}">+${hero.bonusValue}${hero.bonus==='literature'?'文':hero.bonus==='wisdom'?'智':'交'}</span>
            <div class="hero-skill">${hero.skill}</div>
        `;
        div.onclick = () => toggleHero(hero.id);
        grid.appendChild(div);
    });

    // 更新已上阵列表
    const list = document.getElementById('equippedList');
    list.innerHTML = gameState.team.map(id => {
        const h = HEROES.find(hero => hero.id === id);
        return `<div class="equipped-hero">
            <div class="hero-avatar-small" style="background: linear-gradient(135deg, ${getRarityColor(h.rarity)})">${h.weapon}</div>
            <span>${h.name}</span>
            <span class="remove" onclick="toggleHero('${id}')">×</span>
        </div>`;
    }).join('');

    document.getElementById('teamCount').textContent = gameState.team.length;

    // 更新加成提示
    const bonuses = {literature:0, wisdom:0, communication:0};
    gameState.team.forEach(id => {
        const h = HEROES.find(hero => hero.id === id);
        if (h) bonuses[h.bonus] += h.bonusValue;
    });
    document.getElementById('teamBonus').textContent = `加成: 💜+${bonuses.literature} 💙+${bonuses.wisdom} 💛+${bonuses.communication}`;
}

function getRarityColor(rarity) {
    const colors = {
        3: '#FFD700, #FFA500',
        2: '#C0C0C0, #A0A0A0',
        1: '#CD7F32, #8B4513'
    };
    return colors[rarity] || colors[1];
}

function darkenColor(hex) {
    // Simple darkening by reducing brightness
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    const factor = 0.6;
    return `rgb(${Math.floor(r*factor)},${Math.floor(g*factor)},${Math.floor(b*factor)})`;
}

function toggleHero(heroId) {
    const idx = gameState.team.indexOf(heroId);
    if (idx > -1) {
        gameState.team.splice(idx, 1);
    } else if (gameState.team.length < 3) {
        gameState.team.push(heroId);
    } else {
        return; // 已达上限
    }
    saveGame();
    renderHeroGrid();
}

function getHeroBonus(subject) {
    let bonus = 0;
    const subjectMap = {chinese:'literature', math:'wisdom', english:'communication'};
    const energyType = subjectMap[subject];
    gameState.team.forEach(id => {
        const h = HEROES.find(hero => hero.id === id);
        if (h && h.bonus === energyType) bonus += h.bonusValue;
    });
    return bonus;
}

// ==================== UI UPDATE ====================
function getTotalEnergy() { return gameState.literature + gameState.wisdom + gameState.communication; }

function updateMenuUI() {
    document.getElementById('menuLit').textContent = gameState.literature;
    document.getElementById('menuWis').textContent = gameState.wisdom;
    document.getElementById('menuCom').textContent = gameState.communication;
    document.getElementById('menuTotal').textContent = getTotalEnergy();
    document.getElementById('menuChapter').textContent = gameState.chapter;
    document.getElementById('menuLevel').textContent = gameState.level;
    document.getElementById('defenseBtn').disabled = getTotalEnergy() < 10;
    document.getElementById('defenseBtn').textContent = getTotalEnergy() < 10 ? '🏯 守塔战斗 (需要≥10能量)' : '🏯 开始守塔';
}

function updateQuizUI() {
    document.getElementById('quizLit').textContent = gameState.literature;
    document.getElementById('quizWis').textContent = gameState.wisdom;
    document.getElementById('quizCom').textContent = gameState.communication;
    document.getElementById('streak').textContent = gameState.streak;
    document.getElementById('startDefenseBtn').disabled = getTotalEnergy() < 10;
}

function updateDefenseUI() {
    document.getElementById('defLit').textContent = gameState.literature;
    document.getElementById('defWis').textContent = gameState.wisdom;
    document.getElementById('defCom').textContent = gameState.communication;
}

// ==================== QUIZ ====================
let currentQuestion = null;
let currentSubject = 'chinese';
let answered = false;

function selectSubject(subject) {
    currentSubject = subject;
    document.querySelectorAll('.subject-btn').forEach(b => b.classList.remove('selected'));
    event.target.classList.add('selected');
    loadQuestion();
}

function loadQuestion() {
    const bank = QUESTIONS[currentSubject];
    currentQuestion = bank[Math.floor(Math.random() * bank.length)];
    document.getElementById('questionText').textContent = currentQuestion.q;
    const grid = document.getElementById('optionsGrid');
    grid.innerHTML = '';
    const labels = ['A','B','C','D'];
    currentQuestion.o.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = `${labels[i]}. ${opt}`;
        btn.onclick = () => selectAnswer(i);
        grid.appendChild(btn);
    });
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
    answered = false;
}

function selectAnswer(index) {
    if (answered) return;
    answered = true;

    const isCorrect = index === currentQuestion.a;
    const options = document.querySelectorAll('.option');
    options.forEach(o => o.classList.add('disabled'));
    options[index].classList.add(isCorrect ? 'correct' : 'wrong');
    if (!isCorrect) options[currentQuestion.a].classList.add('correct');

    if (isCorrect) {
        gameState.streak++;
        gameState.totalCorrect++;
        const heroBonus = getHeroBonus(currentSubject);
        const streakBonus = gameState.streak >= 5 ? 1 : (gameState.streak >= 3 ? 0 : 0);
        let totalGain = 1 + heroBonus + streakBonus;
        if (currentSubject === 'chinese') gameState.literature += totalGain;
        else if (currentSubject === 'math') gameState.wisdom += totalGain;
        else gameState.communication += totalGain;
        document.getElementById('feedback').textContent = `✅ 答对! +${totalGain}能量${heroBonus > 0 ? ` (角色+${heroBonus})` : ''}`;
        document.getElementById('feedback').className = 'feedback correct';
    } else {
        gameState.streak = 0;
        document.getElementById('feedback').textContent = '❌ 答错了!';
        document.getElementById('feedback').className = 'feedback wrong';
    }

    updateQuizUI();
    saveGame();
    setTimeout(loadQuestion, 1500);
}

// ==================== BATTLE ====================
let battleState = {
    towerHp: 10, maxHp: 10, currentWave: 0, totalWaves: 5,
    enemies: [], skillValue: 0, battleOver: false, victory: false, attackInterval: null
};

function getWavesForLevel() {
    const levelInChapter = ((gameState.level - 1) % 15) + 1;
    if (levelInChapter <= 5) return 3;
    if (levelInChapter <= 10) return 4;
    return 5;
}

function startBattle() {
    battleState = {
        towerHp: 10, maxHp: 10, currentWave: 0, totalWaves: getWavesForLevel(),
        enemies: [], skillValue: 0, battleOver: false, victory: false, attackInterval: null
    };

    document.getElementById('battleLog').innerHTML = '';
    document.getElementById('towerHp').textContent = '10';
    document.getElementById('towerHpSmall').textContent = '10';
    document.getElementById('towerHpFill').style.width = '100%';
    document.getElementById('waveNum').textContent = '0';
    document.getElementById('waveTotal').textContent = battleState.totalWaves;
    document.getElementById('skillFill').style.width = '0%';
    document.getElementById('skillValue').textContent = '0';
    document.getElementById('skillBtn').disabled = true;
    document.getElementById('resultOverlay').style.display = 'none';

    // Clear battle area
    const battleArea = document.getElementById('battleArea');
    battleArea.querySelectorAll('.enemy-sprite').forEach(e => e.remove());

    spawnWave();
    battleState.attackInterval = setInterval(attackStep, 500);
}

function spawnWave() {
    battleState.currentWave++;
    document.getElementById('waveNum').textContent = battleState.currentWave;
    addLog(`第 ${battleState.currentWave} 波敌人出现!`);

    const enemyTypes = CHAPTER_ENEMIES[gameState.chapter] || ['confusion'];
    const count = 3 + battleState.currentWave;
    const battleArea = document.getElementById('battleArea');

    // Clear old enemies
    battleArea.querySelectorAll('.enemy-sprite').forEach(e => e.remove());

    for (let i = 0; i < Math.min(count, 6); i++) {
        const typeId = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
        const template = ENEMIES[typeId];
        const enemy = {...template, currentHp: template.hp, id: Date.now() + i, x: 700 + i * 80, y: 50 + (i % 3) * 100};
        battleState.enemies.push(enemy);

        const sprite = document.createElement('div');
        sprite.className = `enemy-sprite`;
        sprite.id = 'enemy-' + enemy.id;
        sprite.style.left = enemy.x + 'px';
        sprite.style.top = enemy.y + 'px';
        sprite.innerHTML = `
            <div class="enemy-body ${typeId} ${enemy.weakness}">
                <div class="enemy-head"></div>
                <div class="enemy-torso"></div>
                <div class="enemy-legs">
                    <div class="enemy-leg"></div>
                    <div class="enemy-leg"></div>
                </div>
            </div>
            <div class="enemy-name">${enemy.name}</div>
            <div class="enemy-hp-bar"><div class="enemy-hp-fill" style="width:${(enemy.currentHp/enemy.hp)*100}%"></div></div>
            <div class="enemy-hp-text">${enemy.currentHp}/${enemy.hp}</div>
            ${enemy.weakness !== 'none' ? `<div class="enemy-weakness-badge ${enemy.weakness}">${enemy.weakness === 'literature' ? '💜弱点' : enemy.weakness === 'wisdom' ? '💙弱点' : '💛弱点'}</div>` : ''}
        `;
        battleArea.appendChild(sprite);
    }

    updateWaveInfo();
}

function attackStep() {
    if (battleState.battleOver) return;

    // Move enemies
    battleState.enemies.forEach(e => {
        e.x -= e.speed * 0.5;
        const el = document.getElementById('enemy-' + e.id);
        if (el) el.style.left = e.x + 'px';

        if (e.x <= 80) {
            battleState.towerHp--;
            document.getElementById('towerHp').textContent = battleState.towerHp;
            document.getElementById('towerHpSmall').textContent = battleState.towerHp;
            document.getElementById('towerHpFill').style.width = (battleState.towerHp / battleState.maxHp * 100) + '%';
            addLog(`⚠️ ${e.name}到达塔前!`);
            removeEnemy(e.id);
            if (battleState.towerHp <= 0) { endBattle(false); return; }
        }
    });

    // Auto attack
    if (battleState.enemies.length > 0 && getTotalEnergy() > 0) {
        const target = battleState.enemies.reduce((a, b) => a.x < b.x ? a : b);
        let weakType = null;
        if (target.weakness === 'literature' && gameState.literature > 0) weakType = 'literature';
        else if (target.weakness === 'wisdom' && gameState.wisdom > 0) weakType = 'wisdom';
        else if (target.weakness === 'communication' && gameState.communication > 0) weakType = 'communication';

        if (weakType) {
            consumeEnergy(1, weakType);
            killEnemy(target);
            addLog(`💜💙💛 ${weakType}能量攻击! 秒杀${target.name}`);
        } else if (getTotalEnergy() > 0) {
            consumeEnergy(1);
            target.currentHp -= target.hp * 0.2;
            updateEnemyHp(target);
            addLog(`⚪ 攻击${target.name} -20%`);
            if (target.currentHp <= 0) killEnemy(target);
        }
    }

    // Check wave complete
    if (battleState.enemies.length === 0) {
        if (battleState.currentWave >= battleState.totalWaves) {
            endBattle(true);
        } else {
            setTimeout(spawnWave, 1000);
        }
    }
}

function killEnemy(enemy) {
    battleState.skillValue += enemy.skillValue;
    updateSkillBar();
    removeEnemy(enemy.id);
    const reward = enemy.weakness !== 'none' ? 1 : 0.5;
    gameState.literature += reward;
    updateDefenseUI();
}

function removeEnemy(id) {
    battleState.enemies = battleState.enemies.filter(e => e.id !== id);
    const el = document.getElementById('enemy-' + id);
    if (el) el.remove();
}

function updateEnemyHp(enemy) {
    const el = document.getElementById('enemy-' + enemy.id);
    if (el) {
        el.querySelector('.enemy-hp-fill').style.width = (enemy.currentHp / enemy.hp * 100) + '%';
        el.querySelector('.enemy-hp-text').textContent = `${Math.ceil(enemy.currentHp)}/${enemy.hp}`;
    }
}

function updateSkillBar() {
    const pct = Math.min(battleState.skillValue, 100);
    document.getElementById('skillFill').style.width = pct + '%';
    document.getElementById('skillValue').textContent = battleState.skillValue;
    document.getElementById('skillBtn').disabled = battleState.skillValue < 100;
}

function updateWaveInfo() {
    document.getElementById('waveInfo').textContent = `第 ${battleState.currentWave}/${battleState.totalWaves} 波`;
}

function addLog(msg) {
    const log = document.getElementById('battleLog');
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.textContent = msg;
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
    if (log.children.length > 20) log.removeChild(log.firstChild);
}

function useSkill() {
    if (battleState.skillValue < 100) return;
    battleState.skillValue -= 100;
    updateSkillBar();

    battleState.enemies.forEach(e => {
        e.currentHp -= e.hp * 0.5;
        updateEnemyHp(e);
        if (e.currentHp <= 0) killEnemy(e);
    });

    addLog('⚡ 技能释放! 全敌人受损50%');
}

function endBattle(victory) {
    battleState.battleOver = true;
    battleState.victory = victory;
    clearInterval(battleState.attackInterval);

    if (victory) {
        const reward = 10 + gameState.level * 2;
        gameState.literature += reward;
        gameState.wisdom += Math.floor(reward / 2);
        addLog(`🎉 胜利! 奖励能量:+${reward}`);
        document.getElementById('resultEmoji').textContent = '🏆';
        document.getElementById('resultTitle').textContent = '胜利!';
        document.getElementById('resultTitle').className = 'result-title victory';
        if (gameState.level >= gameState.maxUnlocked && gameState.maxUnlocked < 75) {
            gameState.maxUnlocked++;
            if (gameState.level % 15 === 0 && gameState.chapter < 5) {
                gameState.chapter++;
                gameState.level = 1;
            } else if (gameState.level % 15 !== 0) {
                gameState.level++;
            }
        }
    } else {
        addLog('💔 防御失败...');
        document.getElementById('resultEmoji').textContent = '💔';
        document.getElementById('resultTitle').textContent = '失败...';
        document.getElementById('resultTitle').className = 'result-title defeat';
    }

    document.getElementById('rewardEnergy').textContent = victory ? 10 + gameState.level * 2 : 0;
    document.getElementById('resultOverlay').style.display = 'flex';
    updateMenuUI();
    saveGame();
}

function hideResult() {
    document.getElementById('resultOverlay').style.display = 'none';
}

function consumeEnergy(amount, type = null) {
    if (type) {
        if (type === 'literature') gameState.literature -= amount;
        else if (type === 'wisdom') gameState.wisdom -= amount;
        else if (type === 'communication') gameState.communication -= amount;
    } else {
        let remaining = amount;
        const from = Math.min(remaining, gameState.literature);
        gameState.literature -= from; remaining -= from;
        if (remaining > 0) { const from2 = Math.min(remaining, gameState.wisdom); gameState.wisdom -= from2; remaining -= from2; }
        if (remaining > 0) gameState.communication -= remaining;
    }
}

// ==================== SAVE/LOAD ====================
function saveGame() {
    localStorage.setItem('learningGameTD', JSON.stringify(gameState));
}

function loadGame() {
    const saved = localStorage.getItem('learningGameTD');
    if (saved) {
        const data = JSON.parse(saved);
        gameState = {...gameState, ...data};
    }
}

// ==================== INIT ====================
loadGame();
updateMenuUI();
loadQuestion();
</script>
