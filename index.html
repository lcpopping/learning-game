<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6C5CE7">
    <title>学习大闯关</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6C5CE7;
            --secondary: #00CEC9;
            --accent: #FDCB6E;
            --bg-dark: #1A1A2E;
            --bg-light: #16213E;
            --text: #FFFFFF;
            --error: #FF6B6B;
            --success: #26DE81;
        }
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-light));
            min-height: 100vh;
            color: var(--text);
            overflow-x: hidden;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 15px; min-height: 100vh; }
        .page { display: none; animation: fadeIn 0.4s; }
        .page.active { display: flex; flex-direction: column; align-items: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; } }

        .header { width: 100%; display: flex; justify-content: space-between; padding: 12px 15px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 15px; gap: 10px; }
        .player-info { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .level-badge { background: var(--accent); color: #333; padding: 2px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: bold; }
        .gold-display { display: flex; align-items: center; gap: 5px; color: var(--accent); font-weight: bold; }

        .btn { padding: 12px 25px; font-size: 1rem; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; transition: all 0.3s; font-family: inherit; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 5px 20px rgba(108,92,231,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 2px solid rgba(255,255,255,0.2); }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: scale(0.98); }

        .home-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 2.2rem; text-align: center; margin: 15px 0; background: linear-gradient(45deg, var(--primary), var(--secondary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .home-icon { font-size: 3.5rem; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; margin: 15px 0; }
        .char-card { background: rgba(255,255,255,0.08); border-radius: 15px; padding: 15px 10px; text-align: center; cursor: pointer; transition: all 0.3s; position: relative; border: 2px solid transparent; }
        .char-card:hover:not(.locked) { transform: translateY(-3px); background: rgba(255,255,255,0.12); }
        .char-card.selected { border-color: var(--accent); background: rgba(253,203,110,0.15); }
        .char-card.on-team { border-color: var(--success); }
        .char-emoji { font-size: 2.5rem; }
        .char-img { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 5px; object-fit: cover; background: rgba(255,255,255,0.1); }
        .char-name { font-size: 0.85rem; margin-top: 5px; }
        .char-level { font-size: 0.7rem; color: var(--secondary); }
        .char-hp { font-size: 0.65rem; color: var(--error); margin-top: 3px; }
        .team-indicator { position: absolute; top: 5px; right: 5px; font-size: 0.8rem; }

        .section-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.3rem; color: var(--accent); margin: 15px 0 10px; text-align: center; }

        .mode-tabs { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
        .mode-tab { padding: 10px 20px; border-radius: 20px; background: rgba(255,255,255,0.1); border: none; color: white; cursor: pointer; font-family: inherit; font-size: 0.9rem; }
        .mode-tab.active { background: var(--primary); }

        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; margin-bottom: 15px; }
        .level-node { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08); border-radius: 10px; font-size: 0.9rem; cursor: pointer; position: relative; }
        .level-node.completed { background: rgba(38,222,129,0.2); color: var(--success); }
        .level-node.current { background: rgba(253,203,110,0.2); color: var(--accent); animation: pulse 2s infinite; }
        .level-node.locked { opacity: 0.4; cursor: not-allowed; }
        .level-node.boss { background: rgba(255,107,107,0.2); color: var(--error); }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(253,203,110,0.4); } 50% { box-shadow: 0 0 15px 5px rgba(253,203,110,0.3); } }

        .chapter-title { font-size: 1rem; color: var(--secondary); margin: 10px 0 5px; }

        .quiz-header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .quiz-hp { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; }
        .hp-bar { width: 80px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; }
        .hp-fill { height: 100%; background: var(--error); border-radius: 4px; transition: width 0.3s; }
        .quiz-wave { font-size: 0.85rem; color: var(--secondary); }
        .quiz-timer { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .quiz-timer.warning { color: var(--error); animation: blink 0.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 6px; margin-bottom: 15px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 6px; transition: width 0.5s; }

        .team-display { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .team-slot { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; border: 2px dashed rgba(255,255,255,0.2); }
        .team-slot.filled { border-style: solid; border-color: var(--secondary); }

        .question-card { width: 100%; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; margin-bottom: 15px; text-align: center; }
        .question-num { font-size: 0.8rem; color: var(--secondary); margin-bottom: 10px; }
        .question-text { font-size: 1.1rem; line-height: 1.5; }
        .subject-badge { display: inline-block; padding: 3px 12px; background: var(--primary); border-radius: 10px; font-size: 0.7rem; margin-bottom: 8px; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .option-btn { padding: 12px; font-size: 0.95rem; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; cursor: pointer; transition: all 0.3s; text-align: center; }
        .option-btn:hover:not(.disabled) { background: rgba(255,255,255,0.15); border-color: var(--primary); }
        .option-btn.disabled { cursor: not-allowed; }
        .option-btn.correct { background: var(--success); border-color: var(--success); }
        .option-btn.wrong { background: var(--error); border-color: var(--error); }

        .battle-log { width: 100%; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; margin-top: 15px; font-size: 0.8rem; max-height: 80px; overflow-y: auto; }
        .log-entry { padding: 3px 0; }
        .log-damage { color: var(--error); }
        .log-heal { color: var(--success); }

        .result-card { background: rgba(255,255,255,0.05); border-radius: 25px; padding: 25px; text-align: center; width: 100%; max-width: 380px; }
        .result-emoji { font-size: 3.5rem; }
        .result-title { font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.5rem; margin: 10px 0; }
        .result-title.victory { color: var(--success); }
        .result-title.defeat { color: var(--error); }
        .rewards-row { display: flex; gap: 15px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .reward-badge { background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 12px; text-align: center; }
        .reward-icon { font-size: 1.3rem; }
        .reward-val { font-size: 0.9rem; color: var(--accent); font-weight: bold; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }

        .tab-bar { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { padding: 8px 15px; border-radius: 15px; background: rgba(255,255,255,0.1); border: none; color: white; cursor: pointer; font-size: 0.85rem; }
        .tab-btn.active { background: var(--primary); }
        .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
        .gallery-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 8px; text-align: center; }
        .gallery-card.locked { opacity: 0.5; }
        .gallery-card.owned { border: 2px solid var(--accent); }
        .gallery-icon { font-size: 2rem; }
        .gallery-name { font-size: 0.7rem; margin-top: 5px; }
        .gallery-rarity { font-size: 0.65rem; color: var(--secondary); margin-top: 2px; }
        .gallery-frags { font-size: 0.65rem; color: var(--accent); margin-top: 2px; }

        .task-card { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 10px; width: 100%; }
        .task-icon { font-size: 1.8rem; width: 40px; text-align: center; }
        .task-info { flex: 1; }
        .task-name { font-size: 0.9rem; font-weight: bold; }
        .task-desc { font-size: 0.7rem; color: rgba(255,255,255,0.6); margin-top: 2px; }
        .task-progress { font-size: 0.75rem; color: var(--secondary); margin-top: 3px; }
        .task-reward { font-size: 0.8rem; color: var(--accent); }
        .task-btn { padding: 8px 15px; border-radius: 12px; border: none; background: var(--accent); color: #333; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .task-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .dungeon-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 20px; width: 100%; margin-bottom: 15px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .dungeon-card:hover { transform: translateY(-3px); }
        .dungeon-card.ultra { border: 2px solid #ff6b6b; }
        .dungeon-card.tk { border: 2px solid #ffd93d; }
        .dungeon-icon { font-size: 3rem; }
        .dungeon-name { font-size: 1.2rem; font-weight: bold; margin: 10px 0; }
        .dungeon-desc { font-size: 0.8rem; color: rgba(255,255,255,0.6); }
        .dungeon-countdown { font-size: 0.85rem; color: var(--accent); margin-top: 8px; }

        .event-banner { width: 100%; background: linear-gradient(135deg, #ff6b6b, #ffd93d); border-radius: 15px; padding: 15px; margin-bottom: 15px; text-align: center; cursor: pointer; }
        .event-title { font-size: 1rem; font-weight: bold; color: #333; }
        .event-time { font-size: 0.75rem; color: rgba(0,0,0,0.6); margin-top: 5px; }

        .back-btn { position: fixed; top: 15px; left: 15px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 1.2rem; cursor: pointer; z-index: 50; }
        .feedback { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; border-radius: 15px; font-size: 1.3rem; font-weight: bold; z-index: 100; animation: pop 0.4s; display: none; }
        .feedback.correct { background: var(--success); }
        .feedback.wrong { background: var(--error); }
        @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0); } 50% { transform: translate(-50%,-50%) scale(1.2); } 100% { transform: translate(-50%,-50%) scale(1); } }
        .celebration { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }
        .confetti { position: absolute; width: 10px; height: 10px; animation: fall 2s forwards; }
        @keyframes fall { 0% { transform: translateY(-50px); opacity: 1; } 100% { transform: translateY(100vh); opacity: 0; } }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; width: 5px; height: 5px; background: var(--primary); border-radius: 50%; opacity: 0.3; animation: float 15s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(100vh); opacity: 0; } 10% { opacity: 0.3; } 90% { opacity: 0.3; } 100% { transform: translateY(-100vh); opacity: 0; } }

        @media (max-width: 500px) {
            .home-title { font-size: 1.8rem; }
            .char-grid { grid-template-columns: repeat(2, 1fr); }
            .options-grid { grid-template-columns: 1fr; }
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="celebration" id="celebration"></div>
    <div class="feedback" id="feedback"></div>
    <button class="back-btn" id="backBtn" style="display:none;" onclick="goBack()">←</button>

    <div class="container">
        <div class="page active" id="homePage">
            <div class="home-icon">🎓</div>
            <h1 class="home-title">学习大闯关</h1>
            <div class="header">
                <div class="player-info">
                    <div class="avatar">👤</div>
                    <div>
                        <div class="level-badge">Lv.<span id="playerLevel">1</span></div>
                        <div style="font-size:0.75rem;color:rgba(255,255,255,0.6)">金币: <span id="playerGold">100</span></div>
                    </div>
                </div>
                <div style="display:flex;gap:10px;align-items:center;">
                    <div class="gold-display">❤️ <span id="playerHP">10</span></div>
                    <button class="btn btn-secondary" style="padding:8px 15px;font-size:0.8rem;" onclick="showTasks()">📋</button>
                </div>
            </div>

            <div class="event-banner" onclick="showEvents()">
                <div class="event-title">🌸 春节特辑 - 限定角色</div>
                <div class="event-time">活动倒计时: <span id="eventTime">7天</span></div>
            </div>

            <div class="section-title">🎭 科目角色</div>
            <div class="char-grid" id="charGrid"></div>

            <button class="btn btn-primary" onclick="showMainline()" style="margin:15px 0;">⚔️ 主线闯关</button>
            <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
                <button class="btn btn-secondary" onclick="showDungeon('ultra')">🌀 奥特曼副本</button>
                <button class="btn btn-secondary" onclick="showDungeon('tk')">⚔️ 三国副本</button>
                <button class="btn btn-secondary" onclick="showGallery()">📖 图鉴</button>
                <button class="btn btn-secondary" onclick="showShop()">🛒 商店</button>
            </div>
        </div>

        <div class="page" id="mainlinePage">
            <div class="section-title">⚔️ 主线闯关</div>
            <div class="mode-tabs" id="chapterTabs"></div>
            <div id="levelContent"></div>
        </div>

        <div class="page" id="teamPage">
            <div class="section-title">🎯 选择上阵角色</div>
            <div class="team-display" id="teamDisplay"></div>
            <div class="section-title" style="font-size:1rem;">已上阵: <span id="teamCount">0</span>/<span id="maxTeam">1</span></div>
            <div class="char-grid" id="teamCharGrid"></div>
            <button class="btn btn-primary" onclick="startBattle()" style="margin-top:15px;">开始战斗</button>
        </div>

        <div class="page" id="quizPage">
            <div class="quiz-header">
                <div class="quiz-hp"><span>❤️</span><div class="hp-bar"><div class="hp-fill" id="baseHPFill" style="width:100%"></div></div><span id="baseHP">10</span></div>
                <div class="quiz-wave" id="waveInfo">波次 1/5</div>
                <div class="quiz-timer" id="timer">20</div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
            <div class="team-display" id="quizTeamDisplay"></div>
            <div class="question-card">
                <div class="subject-badge" id="subjectBadge">语文</div>
                <div class="question-num" id="questionNum">题目 1/5</div>
                <div class="question-text" id="questionText">题目内容</div>
            </div>
            <div class="options-grid" id="optionsGrid"></div>
            <div class="battle-log" id="battleLog"></div>
        </div>

        <div class="page" id="resultPage">
            <div class="result-card">
                <div class="result-emoji" id="resultEmoji">🏆</div>
                <div class="result-title" id="resultTitle">胜利!</div>
                <div class="rewards-row" id="resultRewards"></div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="showMainline()">继续闯关</button>
                    <button class="btn btn-secondary" onclick="showHome()">返回首页</button>
                </div>
            </div>
        </div>

        <div class="page" id="galleryPage">
            <div class="section-title">📖 角色图鉴</div>
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchGalleryTab('chars')">科目角色</button>
                <button class="tab-btn" onclick="switchGalleryTab('ultra')">奥特曼</button>
                <button class="tab-btn" onclick="switchGalleryTab('tk')">三国人物</button>
            </div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>

        <div class="page" id="dungeonPage">
            <div class="section-title" id="dungeonTitle">🌀 副本</div>
            <div id="dungeonContent"></div>
        </div>

        <div class="page" id="shopPage">
            <div class="section-title">🛒 商店</div>
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchShopTab('chars')">角色</button>
                <button class="tab-btn" onclick="switchShopTab('items')">道具</button>
                <button class="tab-btn" onclick="switchShopTab('equip')">装备</button>
            </div>
            <div id="shopContent"></div>
        </div>

        <div class="page" id="tasksPage">
            <div class="section-title">📋 任务中心</div>
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTaskTab('daily')">日常</button>
                <button class="tab-btn" onclick="switchTaskTab('weekly')">每周</button>
                <button class="tab-btn" onclick="switchTaskTab('event')">活动</button>
            </div>
            <div id="tasksContent"></div>
        </div>

        <div class="page" id="eventsPage">
            <div class="section-title">🎉 活动中心</div>
            <div id="eventsContent"></div>
        </div>
    </div>

<script>

// ==================== GAME STATE ====================
let gameState = {
    player: { level: 1, exp: 0, gold: 100, hp: 10, characters: [], fragments: {}, items: [], equipment: {} },
    subjectChars: [
        { id: 'chinese', level: 1, exp: 0, hp: 100, maxHp: 100, atk: 10 },
        { id: 'math', level: 1, exp: 0, hp: 80, maxHp: 80, atk: 15 },
        { id: 'english', level: 1, exp: 0, hp: 90, maxHp: 90, atk: 12 },
        { id: 'science', level: 1, exp: 0, hp: 85, maxHp: 85, atk: 14 },
        { id: 'sports', level: 1, exp: 0, hp: 95, maxHp: 95, atk: 11 },
        { id: 'art', level: 1, exp: 0, hp: 75, maxHp: 75, atk: 18 }
    ],
    team: [], chapterProgress: [0, 0, 0, 0, 0], unlockedChapters: 1,
    dailyTasks: {}, weeklyTasks: {}, eventTasks: {}
};

let currentBattle = { chapter: 1, level: 1, baseHP: 10, maxBaseHP: 10, wave: 1, totalWaves: 5, questions: [], currentQ: 0, score: 0, streak: 0, timerInterval: null, timeLeft: 20 };

// ==================== INIT ====================
function init() { loadGame(); createParticles(); updateHomeUI(); }
function loadGame() { const saved = localStorage.getItem('learningGameV3'); if (saved) { const data = JSON.parse(saved); gameState = { ...gameState, ...data }; } }
function saveGame() { localStorage.setItem('learningGameV3', JSON.stringify(gameState)); }
function updateHomeUI() { document.getElementById('playerLevel').textContent = gameState.player.level; document.getElementById('playerGold').textContent = gameState.player.gold; document.getElementById('playerHP').textContent = gameState.player.hp; renderCharGrid(); }

function renderCharGrid() {
    const container = document.getElementById('charGrid');
    container.innerHTML = SUBJECT_CHARS.map(sc => {
        const charData = gameState.subjectChars.find(c => c.id === sc.id) || { level: 1, exp: 0 };
        const isOnTeam = gameState.team.includes(sc.id);
        const imgUrl = CHAR_IMAGES[sc.id] || '';
        const iconHtml = imgUrl ? `<img class="char-img" src="${imgUrl}" alt="${sc.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span class="char-emoji" style="display:none">${sc.emoji}</span>` : `<span class="char-emoji">${sc.emoji}</span>`;
        return `<div class="char-card ${isOnTeam ? 'on-team' : ''}" onclick="toggleTeamMember('${sc.id}')"><div class="team-indicator">${isOnTeam ? '✅' : ''}</div>${iconHtml}<div class="char-name">${sc.name}</div><div class="char-level">Lv.${charData.level}</div><div class="char-hp">❤️ ${charData.hp}/${sc.hp}</div></div>`;
    }).join('');
}

function toggleTeamMember(charId) {
    const idx = gameState.team.indexOf(charId);
    const maxTeam = Math.min(gameState.unlockedChapters + 1, 4);
    if (idx > -1) { gameState.team.splice(idx, 1); }
    else if (gameState.team.length < maxTeam) { gameState.team.push(charId); }
    else { alert('上阵角色已达上限！'); return; }
    saveGame();
    updateHomeUI();
    if (document.getElementById('teamCharGrid')) renderTeamSelect();
}

// ==================== NAV ====================
function showPage(pageId) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(pageId).classList.add('active'); document.getElementById('backBtn').style.display = pageId === 'homePage' ? 'none' : 'block'; }
function goBack() { const current = document.querySelector('.page.active').id; if (['mainlinePage', 'galleryPage', 'shopPage', 'tasksPage', 'dungeonPage', 'eventsPage'].includes(current)) { showHome(); } else if (current === 'teamPage') { showMainline(); } else if (current === 'quizPage') { stopTimer(); showMainline(); } else { showHome(); } }
function showHome() { showPage('homePage'); }
function showMainline() { renderChapterTabs(); showPage('mainlinePage'); }
function showGallery() { renderGallery('chars'); showPage('galleryPage'); }
function showShop() { renderShop('chars'); showPage('shopPage'); }
function showTasks() { renderTasks('daily'); showPage('tasksPage'); }
function showEvents() { renderEvents(); showPage('eventsPage'); }

// ==================== MAINLINE ====================
function renderChapterTabs() {
    const container = document.getElementById('chapterTabs');
    container.innerHTML = CHAPTERS.map((ch, i) => `<button class="mode-tab ${i === currentBattle.chapter - 1 ? 'active' : ''}" onclick="selectChapter(${ch.id})">${ch.name}</button>`).join('');
    renderLevelGrid();
}

function selectChapter(chapterId) { currentBattle.chapter = chapterId; document.querySelectorAll('.mode-tab').forEach((t, i) => t.classList.toggle('active', i === chapterId - 1)); renderLevelGrid(); }

function renderLevelGrid() {
    const container = document.getElementById('levelContent');
    const chapter = CHAPTERS[currentBattle.chapter - 1];
    const progress = gameState.chapterProgress[currentBattle.chapter - 1] || 0;
    let html = `<div class="chapter-title">${chapter.name}</div><div class="level-grid">`;
    for (let i = 1; i <= chapter.levels; i++) {
        const isCompleted = i <= progress, isCurrent = i === progress + 1, isBoss = i % 10 === 0, isLocked = i > progress + 1;
        let className = 'level-node';
        if (isCompleted) className += ' completed'; else if (isCurrent) className += ' current'; else if (isLocked) className += ' locked';
        if (isBoss) className += ' boss';
        html += `<div class="${className}" onclick="${!isLocked ? `selectLevel(${i})` : ''}">${i}</div>`;
    }
    html += '</div>';
    container.innerHTML = html;
}

function selectLevel(level) { currentBattle.level = level; currentBattle.baseHP = gameState.player.hp; currentBattle.maxBaseHP = gameState.player.hp; gameState.team = []; showPage('teamPage'); renderTeamSelect(); }

function renderTeamSelect() {
    const maxTeam = Math.min(gameState.unlockedChapters + 1, 4);
    document.getElementById('maxTeam').textContent = maxTeam;
    document.getElementById('teamCount').textContent = gameState.team.length;
    const teamDisplay = document.getElementById('teamDisplay');
    teamDisplay.innerHTML = gameState.team.map(id => { const sc = SUBJECT_CHARS.find(s => s.id === id); const imgUrl = CHAR_IMAGES[sc.id] || ''; return `<div class="team-slot filled">${imgUrl ? `<img src="${imgUrl}" style="width:40px;height:40px;border-radius:50%">` : sc.emoji}</div>`; }).join('') + Array(maxTeam - gameState.team.length).fill('<div class="team-slot"></div>').join('');
    const charGrid = document.getElementById('teamCharGrid');
    charGrid.innerHTML = SUBJECT_CHARS.map(sc => {
        const charData = gameState.subjectChars.find(c => c.id === sc.id) || { level: 1, exp: 0 };
        const isOnTeam = gameState.team.includes(sc.id);
        const imgUrl = CHAR_IMAGES[sc.id] || '';
        const iconHtml = imgUrl ? `<img class="char-img" src="${imgUrl}" alt="${sc.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span class="char-emoji" style="display:none">${sc.emoji}</span>` : `<span class="char-emoji">${sc.emoji}</span>`;
        return `<div class="char-card ${isOnTeam ? 'selected' : ''}" onclick="toggleTeamMember('${sc.id}')">${iconHtml}<div class="char-name">${sc.name}</div><div class="char-level">Lv.${charData.level}</div><div class="char-hp">❤️ ${charData.hp}/${sc.hp}</div></div>`;
    }).join('');
}

// ==================== BATTLE ====================
function startBattle() {
    if (gameState.team.length === 0) { alert('请至少选择1个角色上阵！'); return; }
    const subjects = gameState.team.map(id => SUBJECT_CHARS.find(s => s.id === id).subject);
    currentBattle.totalWaves = 5 + Math.floor(currentBattle.level / 5);
    currentBattle.wave = 1;
    currentBattle.questions = generateBattleQuestions(subjects, currentBattle.totalWaves);
    currentBattle.currentQ = 0; currentBattle.score = 0; currentBattle.streak = 0;
    showPage('quizPage');
    renderBattleQuiz();
}

function generateBattleQuestions(subjects, count) {
    const questions = [];
    for (let i = 0; i < count; i++) {
        const subject = subjects[i % subjects.length];
        const bank = QUESTION_BANK[subject] || QUESTION_BANK.general;
        const q = bank[Math.floor(Math.random() * bank.length)];
        questions.push({ ...q, subject });
    }
    return questions;
}

function renderBattleQuiz() {
    const q = currentBattle.questions[currentBattle.currentQ];
    const subjectInfo = SUBJECT_CHARS.find(sc => sc.subject === q.subject) || SUBJECT_CHARS[0];
    document.getElementById('waveInfo').textContent = `波次 ${currentBattle.wave}/${currentBattle.totalWaves}`;
    document.getElementById('baseHP').textContent = currentBattle.baseHP;
    document.getElementById('baseHPFill').style.width = `${(currentBattle.baseHP / currentBattle.maxBaseHP) * 100}%`;
    document.getElementById('progressFill').style.width = `${(currentBattle.currentQ / currentBattle.totalWaves) * 100}%`;
    document.getElementById('questionNum').textContent = `题目 ${currentBattle.currentQ + 1}/${currentBattle.totalWaves}`;
    document.getElementById('subjectBadge').textContent = subjectInfo.name;
    document.getElementById('questionText').textContent = q.q;
    const quizTeam = document.getElementById('quizTeamDisplay');
    quizTeam.innerHTML = gameState.team.map(id => { const sc = SUBJECT_CHARS.find(s => s.id === id); return `<div class="team-slot filled" style="font-size:1.2rem;">${sc.emoji}</div>`; }).join('');
    const optionsGrid = document.getElementById('optionsGrid');
    const labels = ['A', 'B', 'C', 'D'];
    optionsGrid.innerHTML = q.o.map((opt, i) => `<button class="option-btn" onclick="selectAnswer(${i})"><span class="option-label">${labels[i]}</span><span>${opt}</span></button>`).join('');
    currentBattle.timeLeft = 20;
    currentBattle.timerInterval = setInterval(() => {
        currentBattle.timeLeft--;
        document.getElementById('timer').textContent = currentBattle.timeLeft;
        document.getElementById('timer').classList.toggle('warning', currentBattle.timeLeft <= 5);
        if (currentBattle.timeLeft <= 0) { clearInterval(currentBattle.timerInterval); handleTimeout(); }
    }, 1000);
}

function selectAnswer(index) {
    clearInterval(currentBattle.timerInterval);
    const q = currentBattle.questions[currentBattle.currentQ];
    const isCorrect = index === q.a;
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(b => b.classList.add('disabled'));
    buttons[index].classList.add(isCorrect ? 'correct' : 'wrong');
    if (!isCorrect) buttons[q.a].classList.add('correct');
    const battleLog = document.getElementById('battleLog');
    if (isCorrect) {
        currentBattle.streak++;
        currentBattle.score += 100 + (currentBattle.streak * 10);
        addBattleLog(`✅ 答对！+${100 + (currentBattle.streak * 10)}分`, 'heal');
        createCelebration();
    } else {
        currentBattle.streak = 0;
        currentBattle.baseHP -= 1;
        addBattleLog(`❌ 答错！基地受到1点伤害`, 'damage');
    }
    setTimeout(() => {
        if (currentBattle.baseHP <= 0) endBattle(false);
        else if (currentBattle.currentQ >= currentBattle.totalWaves - 1) endBattle(true);
        else { currentBattle.currentQ++; currentBattle.wave++; renderBattleQuiz(); }
    }, 1000);
}

function handleTimeout() {
    currentBattle.baseHP -= 1;
    currentBattle.streak = 0;
    addBattleLog(`⏰ 超时！基地受到1点伤害`, 'damage');
    setTimeout(() => {
        if (currentBattle.baseHP <= 0) endBattle(false);
        else if (currentBattle.currentQ >= currentBattle.totalWaves - 1) endBattle(true);
        else { currentBattle.currentQ++; currentBattle.wave++; renderBattleQuiz(); }
    }, 1000);
}

function addBattleLog(text, type) { const log = document.getElementById('battleLog'); const entry = document.createElement('div'); entry.className = `log-entry log-${type}`; entry.textContent = text; log.appendChild(entry); log.scrollTop = log.scrollHeight; }
function stopTimer() { clearInterval(currentBattle.timerInterval); }

function endBattle(victory) {
    stopTimer();
    clearCelebration();
    const goldEarned = victory ? Math.floor(currentBattle.score / 10) : Math.floor(currentBattle.score / 20);
    const expEarned = victory ? 50 + currentBattle.level * 10 : 20;
    gameState.player.gold += goldEarned;
    gameState.player.exp += expEarned;
    if (victory) {
        gameState.team.forEach(charId => {
            const charData = gameState.subjectChars.find(c => c.id === charId);
            if (charData) {
                charData.exp += expEarned;
                if (charData.exp >= charData.level * 100) {
                    charData.exp = 0; charData.level++; charData.maxHp += 10; charData.hp = charData.maxHp; charData.atk += 2;
                }
            }
        });
        if (currentBattle.level > (gameState.chapterProgress[currentBattle.chapter - 1] || 0)) { gameState.chapterProgress[currentBattle.chapter - 1] = currentBattle.level; }
        if (currentBattle.level % 10 === 0 && currentBattle.chapter < 5) { gameState.unlockedChapters = Math.max(gameState.unlockedChapters, currentBattle.chapter + 1); }
    }
    let fragmentDrop = null;
    if (victory && Math.random() > 0.5) {
        const allChars = [...SUBJECT_CHARS, ...ULTRA_HEROES, ...TK_HEROES];
        fragmentDrop = allChars[Math.floor(Math.random() * allChars.length)];
        gameState.player.fragments[fragmentDrop.id] = (gameState.player.fragments[fragmentDrop.id] || 0) + 1;
    }
    saveGame();
    document.getElementById('resultEmoji').textContent = victory ? '🏆' : '💔';
    document.getElementById('resultTitle').textContent = victory ? '胜利！' : '失败';
    document.getElementById('resultTitle').className = 'result-title ' + (victory ? 'victory' : 'defeat');
    document.getElementById('resultRewards').innerHTML = `<div class="reward-badge"><div class="reward-icon">🪙</div><div class="reward-val">+${goldEarned}</div></div><div class="reward-badge"><div class="reward-icon">✨</div><div class="reward-val">+${expEarned}经验</div></div>${fragmentDrop ? `<div class="reward-badge"><div class="reward-icon">${fragmentDrop.emoji}</div><div class="reward-val">+1碎片</div></div>` : ''}`;
    showPage('resultPage');
    if (victory) createMassiveCelebration();
}

// ==================== GALLERY ====================
function renderGallery(tab) {
    const container = document.getElementById('galleryGrid');
    let items = [];
    if (tab === 'chars') { items = SUBJECT_CHARS.map(sc => { const charData = gameState.subjectChars.find(c => c.id === sc.id) || { level: 1, exp: 0 }; return { ...sc, owned: true, level: charData.level }; }); }
    else if (tab === 'ultra') { items = ULTRA_HEROES.map(h => ({ ...h, owned: gameState.player.characters?.includes(h.id), fragments: gameState.player.fragments[h.id] || 0 })); }
    else { items = TK_HEROES.map(h => ({ ...h, owned: gameState.player.characters?.includes(h.id), fragments: gameState.player.fragments[h.id] || 0 })); }
    container.innerHTML = items.map(item => {
        const imgUrl = CHAR_IMAGES[item.id] || '';
        const iconHtml = imgUrl ? `<img class="char-img" src="${imgUrl}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span class="gallery-icon" style="display:none">${item.emoji}</span>` : `<span class="gallery-icon">${item.emoji}</span>`;
        return `<div class="gallery-card ${item.owned ? 'owned' : 'locked'}">${iconHtml}<div class="gallery-name">${item.name}</div><div class="gallery-rarity">${item.rarity || ''}</div>${item.owned ? '<div style="color:var(--success);font-size:0.7rem">已拥有</div>' : `<div class="gallery-frags">碎片: ${item.fragments}/${item.fragments}</div>`}</div>`;
    }).join('');
}

function switchGalleryTab(tab) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent.includes(tab === 'chars' ? '科目' : tab === 'ultra' ? '奥特曼' : '三国'))); renderGallery(tab); }

// ==================== SHOP ====================
function renderShop(tab) {
    const container = document.getElementById('shopContent');
    if (tab === 'chars') {
        const allChars = [...ULTRA_HEROES, ...TK_HEROES];
        container.innerHTML = allChars.map(c => { const owned = gameState.player.characters?.includes(c.id); return `<div class="task-card"><div class="task-icon">${c.emoji}</div><div class="task-info"><div class="task-name">${c.name} ${c.rarity}</div><div class="task-desc">技能：${c.skill}</div></div><div class="task-reward">🪙 ${c.price}</div><button class="task-btn" ${owned || gameState.player.gold < c.price ? 'disabled' : ''} onclick="buyChar('${c.id}')">${owned ? '已拥有' : '购买'}</button></div>`; }).join('');
    } else if (tab === 'items') {
        container.innerHTML = SHOP_ITEMS.map(item => `<div class="task-card"><div class="task-icon">${item.emoji}</div><div class="task-info"><div class="task-name">${item.name}</div><div class="task-desc">${item.desc}</div></div><div class="task-reward">🪙 ${item.price}</div><button class="task-btn" ${gameState.player.gold < item.price ? 'disabled' : ''} onclick="buyItem('${item.id}')">购买</button></div>`).join('');
    } else {
        container.innerHTML = EQUIPMENT.map(eq => `<div class="task-card"><div class="task-icon">${eq.emoji}</div><div class="task-info"><div class="task-name">${eq.name}</div><div class="task-desc">${eq.slot} - ${eq.quality}</div></div><div class="task-reward">🪙 ${eq.price}</div><button class="task-btn" ${gameState.player.gold < eq.price ? 'disabled' : ''} onclick="buyEquip('${eq.id}')">购买</button></div>`).join('');
    }
}

function switchShopTab(tab) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent === (tab === 'chars' ? '角色' : tab === 'items' ? '道具' : '装备'))); renderShop(tab); }

function buyChar(id) {
    const allChars = [...ULTRA_HEROES, ...TK_HEROES];
    const char = allChars.find(c => c.id === id);
    if (!char || gameState.player.characters?.includes(id)) return;
    if (gameState.player.gold >= char.price) { gameState.player.gold -= char.price; gameState.player.characters = gameState.player.characters || []; gameState.player.characters.push(id); saveGame(); updateHomeUI(); renderShop('chars'); alert(`恭喜获得 ${char.name}！`); }
}

function buyItem(id) { const item = SHOP_ITEMS.find(i => i.id === id); if (!item || gameState.player.gold < item.price) return; gameState.player.gold -= item.price; gameState.player.items = gameState.player.items || []; gameState.player.items.push({ id: item.id, count: 1 }); saveGame(); updateHomeUI(); renderShop('items'); }

function buyEquip(id) { const eq = EQUIPMENT.find(e => e.id === id); if (!eq || gameState.player.gold < eq.price) return; gameState.player.gold -= eq.price; gameState.player.equipment = gameState.player.equipment || {}; gameState.player.equipment[eq.slot] = id; saveGame(); updateHomeUI(); renderShop('equip'); }

// ==================== TASKS ====================
function renderTasks(tab) {
    const container = document.getElementById('tasksContent');
    let tasks = tab === 'daily' ? DAILY_TASKS : tab === 'weekly' ? WEEKLY_TASKS : EVENT_TASKS;
    const progress = tab === 'daily' ? gameState.dailyTasks : tab === 'weekly' ? gameState.weeklyTasks : gameState.eventTasks;
    container.innerHTML = tasks.map(t => { const p = progress[t.id] || 0; const completed = p >= t.target; return `<div class="task-card"><div class="task-icon">${completed ? '✅' : '📋'}</div><div class="task-info"><div class="task-name">${t.name}</div><div class="task-desc">${t.desc}</div><div class="task-progress">${p}/${t.target}</div></div><div class="task-reward">🪙 ${t.reward.value}</div><button class="task-btn" ${completed ? 'disabled' : ''}>领取</button></div>`; }).join('');
}

function switchTaskTab(tab) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.textContent === (tab === 'daily' ? '日常' : tab === 'weekly' ? '每周' : '活动'))); renderTasks(tab); }

function showDungeon(type) {
    currentBattle.dungeonType = type;
    const container = document.getElementById('dungeonContent');
    const title = document.getElementById('dungeonTitle');
    if (type === 'ultra') {
        title.textContent = '🌀 奥特曼副本 - 光之国挑战';
        container.innerHTML = `<div class="dungeon-card ultra" onclick="startDungeon('ultra')"><div class="dungeon-icon">🌌</div><div class="dungeon-name">光之国挑战</div><div class="dungeon-desc">击败BOSS，收集奥特曼碎片</div><div class="dungeon-countdown">今日剩余次数: 3</div></div>`;
    } else {
        title.textContent = '⚔️ 三国副本 - 群雄逐鹿';
        container.innerHTML = `<div class="dungeon-card tk" onclick="startDungeon('tk')"><div class="dungeon-icon">🏯</div><div class="dungeon-name">群雄逐鹿</div><div class="dungeon-desc">攻占城池，收集三国人物碎片</div><div class="dungeon-countdown">今日剩余次数: 3</div></div>`;
    }
    showPage('dungeonPage');
}

function startDungeon(type) { currentBattle.chapter = type === 'ultra' ? 99 : 98; currentBattle.level = 1; currentBattle.baseHP = 15; currentBattle.maxBaseHP = 15; gameState.team = []; showPage('teamPage'); renderTeamSelect(); }

// ==================== EVENTS ====================
function renderEvents() {
    const container = document.getElementById('eventsContent');
    container.innerHTML = `<div class="task-card" style="background:linear-gradient(135deg,rgba(255,107,107,0.2),rgba(255,217,61,0.2));border:2px solid var(--accent);"><div class="task-icon">🧧</div><div class="task-info"><div class="task-name">🌸 春节特辑</div><div class="task-desc">登录即得限定角色"年兽"！</div><div class="task-progress">活动时间: 2月1日-2月15日</div></div><button class="task-btn" onclick="showTasks()">进行中</button></div><div class="task-card"><div class="task-icon">🎃</div><div class="task-info"><div class="task-name">🎃 万圣节</div><div class="task-desc">不给糖就捣蛋！</div><div class="task-progress">敬请期待</div></div><button class="task-btn" disabled>未开放</button></div><div class="task-card"><div class="task-icon">❄️</div><div class="task-info"><div class="task-name">❄️ 冬至挑战</div><div class="task-desc">吃饺子挑战！</div><div class="task-progress">敬请期待</div></div><button class="task-btn" disabled>未开放</button></div>`;
}

// ==================== EFFECTS ====================
function createCelebration() { const container = document.getElementById('celebration'); const colors = ['#FF6B6B', '#26DE81', '#FDCB6E', '#6C5CE7', '#00CEC9']; for (let i = 0; i < 10; i++) { const confetti = document.createElement('div'); confetti.className = 'confetti'; confetti.style.left = Math.random() * 100 + '%'; confetti.style.background = colors[Math.floor(Math.random() * colors.length)]; confetti.style.animationDelay = Math.random() * 0.5 + 's'; container.appendChild(confetti); setTimeout(() => confetti.remove(), 2500); } }

function createMassiveCelebration() { const container = document.getElementById('celebration'); const colors = ['#FF6B6B', '#26DE81', '#FDCB6E', '#6C5CE7', '#00CEC9']; for (let i = 0; i < 30; i++) { const confetti = document.createElement('div'); confetti.className = 'confetti'; confetti.style.left = Math.random() * 100 + '%'; confetti.style.background = colors[Math.floor(Math.random() * colors.length)]; confetti.style.animationDelay = Math.random() * 2 + 's'; container.appendChild(confetti); setTimeout(() => confetti.remove(), 5000); } }

function clearCelebration() { document.getElementById('celebration').innerHTML = ''; }

function createParticles() { const container = document.getElementById('particles'); for (let i = 0; i < 10; i++) { const particle = document.createElement('div'); particle.className = 'particle'; particle.style.left = Math.random() * 100 + '%'; particle.style.animationDelay = Math.random() * 15 + 's'; container.appendChild(particle); } }

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }

init();
</script>
</body>
